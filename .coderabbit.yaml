# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Source of truth for REPO-LEVEL CodeRabbit settings. A repo
# .coderabbit.yaml REPLACES dashboard repo settings (priority 2 vs 4 —
# no merge), so settings omitted here fall back to schema DEFAULTS, not
# dashboard values. Keep repo settings in this file; treat the repo
# dashboard as read-only. `inheritance: true` below still merges in
# ORGANIZATION-level UI settings (tone, profile) for keys absent here.
#
# Root cause this fixes: auto_review.base_branches defaults to [] (default
# branch only), so PRs targeting dev were silently never auto-reviewed even
# though the dashboard listed dev.

early_access: true

inheritance: true

reviews:
  request_changes_workflow: true
  high_level_summary_in_walkthrough: true
  collapse_walkthrough: false
  auto_apply_labels: true
  auto_review:
    drafts: true
    base_branches:
      - dev
  finishing_touches:
    unit_tests:
      enabled: false
    simplify:
      enabled: true
  tools:
    fbinfer:
      enabled: true

  path_filters:
    # Global
    - "!**/node_modules/**"
    - "!**/dist/**"
    - "!**/build/**"
    - "!**/.claude/**"
    - "!**/.gemini/**"
    - "!**/.agents/**"
    - "!**/.spec-workflow/**"
    - "!**/.codacy/**"
    - "!**/.github/**"
    - "!**/vendor/**"
    - "!**/deprecated/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/package-lock.json"
    - "!**/pnpm-lock.yaml"
    - "!**/yarn.lock"
    - "!**/screenshots/**"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.svg"
    # StakTrakr-specific
    - "!data/**"
    - "!sw.js"
    - "!devops/version.lock"

  path_instructions:
    - path: "js/**/*.js"
      instructions: |
        - Vanilla JS with NO bundler. Module-scope functions need explicit
          `window.X = X` in the exports block to be testable.
        - Prefer existing helpers: `safeGetElement` (DOM), `saveData` /
          `loadData` (localStorage), `sanitizeHtml` (output).
        - Only storage keys in `ALLOWED_STORAGE_KEYS` (constants.js) are
          permitted. A `typeof ALLOWED_STORAGE_KEYS !== 'undefined'` guard
          is defensive coding, NOT a bug — do not flag it.
        - New JS files must be registered in both `sw.js` CORE_ASSETS and
          `index.html` script load order.
    - path: "css/**/*.css"
      instructions: |
        - Respect component scoping; global selectors can leak into
          component-scoped DOM.
    - path: "devops/pollers/**/Dockerfile*"
      instructions: |
        - Check for pinned base image versions (no `:latest` tags).
        - Flag any secrets or credentials in build args.
    - path: "devops/pollers/home-poller/docker-entrypoint.sh"
      instructions: |
        - This file is the AUTHORITATIVE source of truth for poller cron
          schedules. If DocVault docs disagree, the entrypoint wins.
    - path: "tests/**"
      instructions: |
        - Verify meaningful assertions (not just "it runs without error").
        - For Playwright tests on vanilla JS: internal state must be injected
          via `localStorage` (`page.addInitScript`), not by patching
          `window.X` post-load.

chat:
  integrations:
    jira:
      usage: disabled
    linear:
      usage: disabled

knowledge_base:
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: enabled

issue_enrichment:
  auto_enrich:
    enabled: true
  labeling:
    auto_apply_labels: true
