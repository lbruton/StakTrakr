<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StakTrakr — Market Data Module Prototype v2</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<script src="https://cdn.jsdelivr.net/npm/apexcharts@4/dist/apexcharts.min.js"></script>
<style>
  /* ===== Theme: Dark (default) ===== */
  :root, [data-theme="dark"] {
    --success: #10b981; --danger: #ef4444;
    --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-card: #1e293b;
    --text-primary: #f8fafc; --text-secondary: #cbd5e1; --text-muted: #94a3b8;
    --border: #334155;
    --silver: #d1d5db; --gold: #fbbf24; --platinum: #f3f4f6; --palladium: #d8b4fe;
    --primary: #3b82f6; --warning: #f59e0b;
    --bg-tertiary: #334155;
    --spacing-xs: 0.2rem; --spacing-sm: 0.4rem; --spacing: 0.75rem;
    --spacing-lg: 1.25rem; --spacing-xl: 1.5rem;
    --radius: 8px; --radius-lg: 12px;
    --shadow-sm: 0 1px 3px 0 rgb(0 0 0 / 0.1);
    --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.15), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  }

  /* ===== Theme: Light ===== */
  [data-theme="light"] {
    --success: #059669; --danger: #dc2626;
    --bg-primary: #f8fafc; --bg-secondary: #e2e8f0; --bg-card: #f1f5f9;
    --text-primary: #1b232c; --text-secondary: #344351; --text-muted: #64748b;
    --border: #cbd5e1;
    --silver: #5f6673; --gold: #a04808; --platinum: #4b5563; --palladium: #6d35d0;
    --primary: #2563eb; --warning: #d97706;
    --bg-tertiary: #cbd5e1;
  }

  /* ===== Theme: Sepia ===== */
  [data-theme="sepia"] {
    --success: #698f3f; --danger: #dc2626;
    --bg-primary: #dcbfa3; --bg-secondary: #d4b896; --bg-card: #e8dcc5;
    --text-primary: #3a2a18; --text-secondary: #5a4a38; --text-muted: #7a6a58;
    --border: #d1c2a5;
    --silver: #706b66; --gold: #80620a; --platinum: #5a5a5a; --palladium: #6b5640;
    --primary: #6b4c2a; --warning: #a0722a;
    --bg-tertiary: #c8b498;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.6; }
  body { background: var(--bg-primary); color: var(--text-primary); font-size: 14px; min-height: 100vh; transition: background 0.3s, color 0.3s; }

  /* Layout */
  .container { display: grid; gap: var(--spacing-xl); max-width: 100%; margin: 0 auto; padding: var(--spacing-lg); }
  @media (min-width: 1280px) { .container { max-width: 1240px; } }
  section.component { background: var(--bg-card); padding: var(--spacing-lg); border-radius: var(--radius-lg); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
  section.component[hidden] { display: none; }

  /* Header */
  .proto-header { display: flex; justify-content: space-between; align-items: center; padding: var(--spacing) var(--spacing-xl); background: var(--bg-card); border-bottom: 1px solid var(--border); margin-bottom: 0; flex-wrap: wrap; gap: 8px; }
  .proto-header h1 { font-size: 1.1rem; font-weight: 700; color: var(--primary); }
  .badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 10px; background: var(--primary); color: #fff; font-weight: 700; margin-left: 8px; }
  .theme-toggle { background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); padding: 4px 12px; border-radius: var(--radius); cursor: pointer; font-size: 12px; font-weight: 600; transition: all 0.2s; }
  .theme-toggle:hover { border-color: var(--primary); color: var(--text-primary); }

  /* Toggle panel */
  .toggle-panel { display: flex; flex-wrap: wrap; gap: 12px; padding: var(--spacing) var(--spacing-xl); background: var(--bg-secondary); border-bottom: 1px solid var(--border); align-items: center; }
  .toggle-panel label { font-size: 12px; color: var(--text-secondary); cursor: pointer; display: flex; align-items: center; gap: 4px; user-select: none; }
  .toggle-panel label:hover { color: var(--text-primary); }
  .toggle-panel input[type="checkbox"] { accent-color: var(--primary); }

  /* Section titles */
  .section-title { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; margin-bottom: var(--spacing); }

  /* Spot cards grid */
  .spot-cards-grid { display: grid; gap: 1rem; grid-template-columns: 1fr 1fr; }
  @media (min-width: 960px) { .spot-cards-grid { grid-template-columns: repeat(4, 1fr); } }

  .spot-card { position: relative; background: var(--bg-primary); border-radius: var(--radius-lg); text-align: center; border: 1px solid var(--border); box-shadow: var(--shadow-sm); overflow: hidden; min-height: 120px; }
  .spot-card .chart-bg { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; opacity: 0.3; pointer-events: none; }
  .spot-card-header { position: relative; z-index: 1; display: flex; align-items: center; justify-content: space-between; padding: var(--spacing) var(--spacing) 0; }
  .spot-card-label { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
  .spot-card-value { position: relative; z-index: 1; font-size: 1.5rem; font-weight: 700; padding: 0 var(--spacing); font-family: "SF Mono", "Fira Code", monospace; }
  .spot-card-change { font-size: 0.8rem; font-weight: 600; text-align: center; padding: 2px 0; position: relative; z-index: 1; }
  .spot-up { color: var(--success); }
  .spot-down { color: var(--danger); }
  .spot-card-timestamp { position: relative; z-index: 1; font-size: 0.65rem; color: var(--text-muted); padding: 0 var(--spacing) var(--spacing); }

  /* Market data 2-col grid */
  .market-grid { display: grid; gap: var(--spacing-xl); grid-template-columns: 1fr; }
  @media (min-width: 768px) { .market-grid { grid-template-columns: 1fr 1fr; } }
  .market-grid > section.component { min-width: 0; overflow-x: auto; }

  /* Range bar */
  .range-bar-container { margin-bottom: 10px; }
  .range-bar-label { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .range-bar-label .name { font-size: 12px; font-weight: 600; color: var(--text-primary); display: flex; align-items: center; gap: 6px; }
  .metal-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
  .range-bar-label .price { font-size: 12px; font-weight: 700; color: var(--primary); font-family: "SF Mono", "Fira Code", monospace; }
  .range-bar { position: relative; height: 6px; background: var(--bg-tertiary); border-radius: 3px; overflow: visible; }
  .range-bar-fill { position: absolute; height: 100%; border-radius: 3px; }
  .range-bar-median { position: absolute; width: 3px; height: 14px; top: -4px; border-radius: 2px; background: var(--primary); }
  .range-bar-values { display: flex; justify-content: space-between; font-size: 9px; color: var(--text-muted); margin-top: 2px; font-family: "SF Mono", "Fira Code", monospace; }

  /* Goldback */
  .denom-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  @media (max-width: 480px) { .denom-grid { grid-template-columns: repeat(3, 1fr); } }
  .denom-card { text-align: center; background: var(--bg-secondary); border: 1px solid var(--border); border-radius: var(--radius); padding: 10px 8px; }
  .denom-card .denom-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; font-weight: 600; }
  .denom-card .denom-value { font-size: 16px; font-weight: 700; color: var(--gold); font-family: "SF Mono", "Fira Code", monospace; margin-top: 2px; }
  .denom-card .denom-sub { font-size: 9px; color: var(--text-muted); margin-top: 2px; }
  .goldback-rate { text-align: center; margin-bottom: 16px; }
  .goldback-rate .rate-value { font-size: 1.5rem; font-weight: 700; color: var(--gold); font-family: "SF Mono", "Fira Code", monospace; }
  .goldback-rate .rate-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .goldback-unavailable { text-align: center; color: var(--text-muted); font-style: italic; padding: 20px 0; }

  /* Ticker */
  .ticker-wrap { overflow: hidden; position: relative; }
  .ticker-track { display: flex; gap: 8px; animation: tickerScroll 30s linear infinite; width: max-content; }
  .ticker-track.static { animation: none; width: auto; flex-wrap: wrap; }
  @keyframes tickerScroll {
    0% { transform: translateX(0); }
    100% { transform: translateX(-50%); }
  }
  .ticker-item { flex-shrink: 0; display: flex; align-items: center; gap: 6px; padding: 6px 12px; background: var(--bg-primary); border: 1px solid var(--border); border-radius: var(--radius); font-size: 11px; }
  .ticker-item .coin { font-weight: 600; color: var(--text-primary); white-space: nowrap; }
  .ticker-item .vendor { color: var(--text-muted); white-space: nowrap; }
  .ticker-item .price { font-weight: 700; font-family: "SF Mono", "Fira Code", monospace; color: var(--success); white-space: nowrap; }
  .ticker-item .premium { font-size: 10px; color: var(--text-muted); white-space: nowrap; }

  /* Heat map container */
  .heatmap-container { min-height: 200px; }

  /* Loading */
  .loading { color: var(--text-muted); font-style: italic; font-size: 12px; padding: 20px 0; text-align: center; }

  /* ApexCharts theme overrides */
  .apexcharts-tooltip { font-family: "Inter", -apple-system, sans-serif !important; }
</style>
</head>
<body>

<div class="proto-header">
  <div>
    <h1>StakTrakr <span class="badge">Market Data v2 Prototype</span></h1>
  </div>
  <div style="display:flex;gap:8px;align-items:center;">
    <span style="font-size:11px;color:var(--text-muted);" id="dataAge">Loading...</span>
    <button class="theme-toggle" id="themeBtn">dark</button>
  </div>
</div>

<div class="toggle-panel" id="togglePanel">
  <span style="font-size:11px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:0.05em;">Components:</span>
  <label><input type="checkbox" checked data-target="spotSection"> Spot Cards</label>
  <label><input type="checkbox" checked data-target="retailSection"> Retail Ranges</label>
  <label><input type="checkbox" checked data-target="heatmapSection"> Heat Map</label>
  <label><input type="checkbox" checked data-target="goldbackSection"> Goldback</label>
  <label><input type="checkbox" checked data-target="tickerSection"> Best Price Ticker</label>
</div>

<div class="container">

  <!-- 1. Enhanced Spot Cards -->
  <section class="component" id="spotSection">
    <div class="section-title">Spot Prices — Live</div>
    <div class="spot-cards-grid" id="spotCardsGrid">
      <div class="loading">Fetching spot prices...</div>
    </div>
  </section>

  <!-- 2+3: Retail Ranges + Heat Map in 2-col grid -->
  <div class="market-grid" id="marketGrid">
    <section class="component" id="retailSection">
      <div class="section-title">Retail Price Ranges</div>
      <div id="priceRanges"><div class="loading">Loading...</div></div>
    </section>

    <section class="component" id="heatmapSection">
      <div class="section-title">Premium Heat Map — % Over Spot</div>
      <div class="heatmap-container" id="premiumHeatMap"><div class="loading">Loading...</div></div>
    </section>
  </div>

  <!-- 4. Goldback Calculator -->
  <section class="component" id="goldbackSection">
    <div class="section-title">Goldback Denominations</div>
    <div id="goldbackCard"><div class="loading">Loading...</div></div>
  </section>

  <!-- 5. Best Price Ticker -->
  <section class="component" id="tickerSection">
    <div class="section-title">Best Prices Right Now</div>
    <div class="ticker-wrap" id="bestPriceTicker">
      <div class="loading">Loading...</div>
    </div>
  </section>

</div>

<script>
/* NOTE: This is a self-contained prototype. innerHTML usage here renders only
   API-sourced data (no user input), so sanitization is not required.
   Production code in js/market-data.js will use sanitizeHtml(). */

const V2 = "https://api.staktrakr.com/data/v2";

const METAL_COLORS = {
  xau: { dark: "#fbbf24", light: "#a04808", sepia: "#80620a" },
  xag: { dark: "#d1d5db", light: "#5f6673", sepia: "#706b66" },
  xpt: { dark: "#f3f4f6", light: "#4b5563", sepia: "#5a5a5a" },
  xpd: { dark: "#d8b4fe", light: "#6d35d0", sepia: "#6b5640" }
};
const METAL_NAMES = { xau: "Gold", xag: "Silver", xpt: "Platinum", xpd: "Palladium" };

const VENDOR_COLORS = {
  apmex: "#60a5fa", jmbullion: "#fbbf24", sdbullion: "#34d399",
  monumentmetals: "#c4b5fd", herobullion: "#f87171", bullionexchanges: "#f472b6",
  summitmetals: "#22d3ee", goldback: "#d4a017", providentmetals: "#a3e635",
  gainesvillecoins: "#fb923c"
};

let spotData = null, retailData = null, coinDetails = {}, spotHistory = null, goldbackData = null;
let sparklineCharts = {};
let heatmapChart = null;

function getTheme() {
  return document.documentElement.dataset.theme || "dark";
}

function metalColor(metal) {
  const theme = getTheme();
  return METAL_COLORS[metal] ? (METAL_COLORS[metal][theme] || METAL_COLORS[metal].dark) : "#94a3b8";
}

function fmt(n, decimals = 2) {
  return Number(n).toLocaleString("en", { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
}

function shortVendor(vid) {
  const map = { apmex: "APMEX", jmbullion: "JM", sdbullion: "SD", monumentmetals: "Monument",
    herobullion: "Hero", bullionexchanges: "BullionEx", summitmetals: "Summit",
    gainesvillecoins: "G'ville", providentmetals: "Provident", goldback: "Goldback" };
  return map[vid] || vid;
}

// Theme toggle — cycles dark > light > sepia
document.getElementById("themeBtn").addEventListener("click", function() {
  const t = getTheme();
  const next = t === "dark" ? "light" : t === "light" ? "sepia" : "dark";
  document.documentElement.dataset.theme = next;
  this.textContent = next;
  if (spotData && spotHistory) renderSpotCards();
  if (retailData) renderPriceRanges();
  if (spotData && retailData && Object.keys(coinDetails).length) renderPremiumHeatMap();
  if (goldbackData) renderGoldbackCard();
});

// Component toggles
document.getElementById("togglePanel").addEventListener("change", function(e) {
  if (!e.target.dataset.target) return;
  const section = document.getElementById(e.target.dataset.target);
  if (section) section.hidden = !e.target.checked;
});

// Fetch all data
async function loadAllData() {
  const results = await Promise.allSettled([
    fetch(V2 + "/spot/latest.json").then(r => r.json()),
    fetch(V2 + "/retail/latest.json").then(r => r.json()),
    fetch(V2 + "/spot/history/7d.json").then(r => r.json()),
    fetch(V2 + "/goldback/latest.json").then(r => r.json()),
  ]);

  spotData = results[0].status === "fulfilled" ? results[0].value : null;
  retailData = results[1].status === "fulfilled" ? results[1].value : null;
  spotHistory = results[2].status === "fulfilled" ? results[2].value : null;
  goldbackData = results[3].status === "fulfilled" ? results[3].value : null;

  if (spotData) {
    document.getElementById("dataAge").textContent = "Updated: " + new Date(spotData.generated_at).toLocaleTimeString();
  }

  // Fetch per-coin vendor details
  if (retailData) {
    const slugs = Object.keys(retailData.data.coins);
    await Promise.allSettled(slugs.map(async (slug) => {
      try {
        const r = await fetch(V2 + "/retail/" + slug + "/latest.json");
        if (r.ok) coinDetails[slug] = await r.json();
      } catch(e) { /* skip */ }
    }));
  }

  renderSpotCards();
  renderPriceRanges();
  renderPremiumHeatMap();
  renderGoldbackCard();
  renderBestPriceTicker();
}

// ============================================================
// 1. Enhanced Spot Cards — Lightweight Charts sparkline bg
// ============================================================
function renderSpotCards() {
  const grid = document.getElementById("spotCardsGrid");
  if (!spotData) { grid.textContent = ""; grid.insertAdjacentHTML("beforeend", '<div class="loading">Spot data unavailable</div>'); return; }

  const metals = ["xau", "xag", "xpt", "xpd"];

  // Destroy old charts
  Object.values(sparklineCharts).forEach(c => { try { c.remove(); } catch(e) {} });
  sparklineCharts = {};

  grid.textContent = "";
  grid.insertAdjacentHTML("beforeend", metals.map(m => {
    const d = spotData.data[m];
    const price = fmt(d.price);
    let changeStr = "", changeCls = "";
    if (spotHistory && spotHistory.data[m] && spotHistory.data[m].length >= 2) {
      const hist = spotHistory.data[m];
      const oldest = hist[0].close;
      const changePct = ((d.price - oldest) / oldest) * 100;
      changeStr = (changePct > 0 ? "+" : "") + changePct.toFixed(2) + "%";
      changeCls = changePct > 0 ? "spot-up" : changePct < 0 ? "spot-down" : "";
    }
    return '<div class="spot-card" data-metal="' + m + '">'
      + '<div class="chart-bg" id="spark-' + m + '"></div>'
      + '<div class="spot-card-header"><span class="spot-card-label">' + METAL_NAMES[m] + '</span><span style="font-size:10px;color:var(--text-muted);">7D</span></div>'
      + '<div class="spot-card-value" style="color:' + metalColor(m) + ';">$' + price + '</div>'
      + '<div class="spot-card-change ' + changeCls + '">' + changeStr + '</div>'
      + '<div class="spot-card-timestamp">' + new Date(spotData.generated_at).toLocaleTimeString() + '</div>'
      + '</div>';
  }).join(""));

  // Create Lightweight Charts sparklines
  metals.forEach(m => {
    const container = document.getElementById("spark-" + m);
    if (!container || !spotHistory || !spotHistory.data[m]) return;

    const color = metalColor(m);

    const chart = LightweightCharts.createChart(container, {
      autoSize: true,
      layout: { background: { type: "solid", color: "transparent" }, textColor: "transparent" },
      grid: { vertLines: { visible: false }, horzLines: { visible: false } },
      crosshair: { mode: 0 },
      rightPriceScale: { visible: false },
      timeScale: { visible: false },
      handleScroll: false,
      handleScale: false,
    });

    const series = chart.addSeries(LightweightCharts.AreaSeries, {
      lineColor: color,
      topColor: color + "4D",
      bottomColor: color + "0D",
      lineWidth: 1.5,
      crosshairMarkerVisible: false,
      priceLineVisible: false,
      lastValueVisible: false,
    });

    const rows = spotHistory.data[m];
    const data = rows.map(r => ({
      time: r.t.split("T")[0],
      value: r.close,
    }));
    series.setData(data);
    chart.timeScale().fitContent();

    sparklineCharts[m] = chart;
  });
}

// ============================================================
// 2. Retail Price Ranges — CSS only horizontal bars
// ============================================================
function renderPriceRanges() {
  const container = document.getElementById("priceRanges");
  if (!retailData) { container.textContent = ""; container.insertAdjacentHTML("beforeend", '<div class="loading">Retail data unavailable</div>'); return; }

  const coins = retailData.data.coins;
  const metalOrder = ["xau", "xag", "xpt", "xpd"];
  const groups = {};
  metalOrder.forEach(m => { groups[m] = []; });

  Object.entries(coins).forEach(([slug, c]) => {
    if (c.metal === "goldback") return;
    if (groups[c.metal]) groups[c.metal].push({ slug, ...c });
  });

  let html = "";
  metalOrder.forEach(m => {
    const items = groups[m];
    if (!items.length) return;
    html += '<div style="margin-bottom:12px;">'
      + '<div style="font-size:10px;text-transform:uppercase;color:' + metalColor(m) + ';font-weight:700;letter-spacing:0.05em;margin-bottom:6px;">' + METAL_NAMES[m] + '</div>';

    items.sort((a, b) => b.median - a.median);
    items.forEach(c => {
      const range = c.high - c.low;
      const medianPct = range > 0 ? ((c.median - c.low) / range * 100) : 50;
      const color = metalColor(c.metal);
      const shortName = c.name.replace(/ \(1\/1000 oz gold\)/, "").replace(/ \(.999\)/, "");
      html += '<div class="range-bar-container">'
        + '<div class="range-bar-label"><span class="name"><span class="metal-dot" style="background:' + color + ';"></span>' + shortName + '</span><span class="price">$' + fmt(c.median) + '</span></div>'
        + '<div class="range-bar"><div class="range-bar-fill" style="left:0;width:100%;background:linear-gradient(90deg,' + color + '22,' + color + '44);"></div><div class="range-bar-median" style="left:' + medianPct + '%;"></div></div>'
        + '<div class="range-bar-values"><span>$' + fmt(c.low) + '</span><span>' + c.vendor_count + ' vendors</span><span>$' + fmt(c.high) + '</span></div>'
        + '</div>';
    });
    html += "</div>";
  });

  container.textContent = "";
  container.insertAdjacentHTML("beforeend", html);
}

// ============================================================
// 3. Premium Heat Map — ApexCharts
// ============================================================
function renderPremiumHeatMap() {
  const container = document.getElementById("premiumHeatMap");
  if (!spotData || !retailData) { container.textContent = ""; container.insertAdjacentHTML("beforeend", '<div class="loading">Waiting for data...</div>'); return; }

  const spotPrices = {};
  Object.entries(spotData.data).forEach(([k, v]) => { spotPrices[k] = v.price; });

  const coins = retailData.data.coins;
  const slugs = Object.keys(coins).filter(s => coins[s].metal !== "goldback");
  const vendorSet = new Set();
  slugs.forEach(s => {
    if (coinDetails[s]) Object.keys(coinDetails[s].data.vendors).forEach(v => vendorSet.add(v));
  });
  const vendorIds = Array.from(vendorSet).sort();

  if (vendorIds.length === 0) {
    container.textContent = "";
    container.insertAdjacentHTML("beforeend", '<div class="loading">No vendor detail data available</div>');
    return;
  }

  // Build series: each series = one coin row
  const series = [];
  slugs.forEach(slug => {
    const c = coins[slug];
    const spotPrice = spotPrices[c.metal];
    const weightOz = c.weight_oz || 1;
    const spotForItem = spotPrice ? spotPrice * weightOz : null;
    const detail = coinDetails[slug];
    const shortName = c.name.replace(/ 1 oz$/, "").replace(/ 10 oz.*$/, " 10oz");

    const dataPoints = vendorIds.map(vid => {
      const v = detail ? (detail.data.vendors[vid] || null) : null;
      if (!v || !v.price || !spotForItem) return { x: shortVendor(vid), y: null, meta: { price: null, vendor: vid, carried: false, oos: true } };
      const premium = ((v.price - spotForItem) / spotForItem) * 100;
      return {
        x: shortVendor(vid),
        y: Math.round(premium * 10) / 10,
        meta: { price: v.price, vendor: vid, carried: v.carried, oos: !v.in_stock, premiumDollar: (v.price - spotForItem).toFixed(2) }
      };
    });

    series.push({ name: shortName, data: dataPoints });
  });

  // Destroy old chart
  if (heatmapChart) { heatmapChart.destroy(); heatmapChart = null; }
  container.textContent = "";

  const theme = getTheme();
  const isDark = theme === "dark";
  const isSepia = theme === "sepia";
  const textColor = isDark ? "#f8fafc" : isSepia ? "#3a2a18" : "#1b232c";
  const mutedColor = isDark ? "#94a3b8" : isSepia ? "#7a6a58" : "#64748b";
  const tooltipBg = isDark ? "#1e293b" : isSepia ? "#e8dcc5" : "#f1f5f9";
  const tooltipBorder = isDark ? "#334155" : isSepia ? "#d1c2a5" : "#cbd5e1";

  const options = {
    chart: {
      type: "heatmap",
      height: Math.max(300, slugs.length * 32 + 60),
      toolbar: { show: false },
      background: "transparent",
      fontFamily: '"Inter", -apple-system, sans-serif',
    },
    series: series,
    plotOptions: {
      heatmap: {
        radius: 4,
        enableShades: false,
        colorScale: {
          ranges: [
            { from: -100, to: 0, color: "#10b981", name: "Below spot" },
            { from: 0, to: 3, color: "#10b981", name: "0-3%" },
            { from: 3.01, to: 6, color: "#059669", name: "3-6%" },
            { from: 6.01, to: 10, color: "#f59e0b", name: "6-10%" },
            { from: 10.01, to: 15, color: "#d97706", name: "10-15%" },
            { from: 15.01, to: 25, color: "#ef4444", name: "15-25%" },
            { from: 25.01, to: 100, color: "#dc2626", name: ">25%" },
          ]
        }
      }
    },
    dataLabels: {
      enabled: true,
      style: { fontSize: "10px", fontWeight: 600, colors: ["#fff"] },
      formatter: function(val) {
        if (val === null || val === undefined) return "--";
        return val.toFixed(0) + "%";
      }
    },
    xaxis: {
      labels: {
        style: { colors: mutedColor, fontSize: "9px", fontWeight: 600 },
        rotate: -45,
        rotateAlways: true,
      },
      axisBorder: { show: false },
      axisTicks: { show: false },
    },
    yaxis: {
      labels: {
        style: { colors: textColor, fontSize: "10px" },
        maxWidth: 140,
      }
    },
    grid: { show: false },
    tooltip: {
      custom: function({ seriesIndex, dataPointIndex, w }) {
        const point = w.config.series[seriesIndex].data[dataPointIndex];
        const coinName = w.config.series[seriesIndex].name;
        const meta = point.meta || {};
        if (!meta.price) return '<div style="padding:8px;background:' + tooltipBg + ';border:1px solid ' + tooltipBorder + ';border-radius:6px;font-size:12px;color:' + textColor + ';">' + coinName + ' &mdash; ' + (meta.vendor || "?") + ': No data</div>';
        let h = '<div style="padding:8px 12px;background:' + tooltipBg + ';border:1px solid ' + tooltipBorder + ';border-radius:6px;font-size:12px;color:' + textColor + ';min-width:160px;">';
        h += '<div style="font-weight:700;margin-bottom:4px;">' + coinName + '</div>';
        h += '<div style="color:' + mutedColor + ';margin-bottom:2px;">' + meta.vendor + '</div>';
        h += '<div>Price: <strong style="font-family:monospace;">$' + fmt(meta.price) + '</strong></div>';
        h += '<div>Premium: <strong style="font-family:monospace;">' + point.y + '%</strong> ($' + meta.premiumDollar + ')</div>';
        if (meta.carried) h += '<div style="color:' + (isDark ? "#f59e0b" : "#d97706") + ';font-size:11px;">Carried price</div>';
        if (meta.oos) h += '<div style="color:' + (isDark ? "#ef4444" : "#dc2626") + ';font-size:11px;">Out of stock</div>';
        h += '</div>';
        return h;
      }
    },
    states: {
      hover: { filter: { type: "darken", value: 0.15 } }
    },
    legend: { show: false },
    theme: { mode: isDark ? "dark" : "light" },
  };

  heatmapChart = new ApexCharts(container, options);
  heatmapChart.render();
}

// ============================================================
// 4. Goldback Calculator — CSS only
// ============================================================
function renderGoldbackCard() {
  const container = document.getElementById("goldbackCard");

  if (!goldbackData || !goldbackData.data) {
    container.textContent = "";
    container.insertAdjacentHTML("beforeend", '<div class="goldback-unavailable">Goldback data unavailable</div>');
    return;
  }

  const gb = goldbackData.data;
  const g1Rate = gb.g1_usd;
  const denoms = gb.denominations;
  const goldOzPerG1 = 1 / 1000;

  let meltPerG1 = null;
  if (spotData && spotData.data.xau) {
    meltPerG1 = spotData.data.xau.price * goldOzPerG1;
  }

  let html = '<div class="goldback-rate">'
    + '<div class="rate-label">G1 Exchange Rate</div>'
    + '<div class="rate-value">$' + fmt(g1Rate) + '</div>'
    + (meltPerG1 ? '<div style="font-size:11px;color:var(--text-muted);margin-top:4px;">Gold melt: $' + fmt(meltPerG1) + ' per G1</div>' : "")
    + '</div>';

  html += '<div class="denom-grid">';
  const denomEntries = [
    { label: "G1", value: denoms.g1, mult: 1 },
    { label: "G5", value: denoms.g5, mult: 5 },
    { label: "G10", value: denoms.g10, mult: 10 },
    { label: "G25", value: denoms.g25, mult: 25 },
    { label: "G50", value: denoms.g50, mult: 50 },
  ];

  denomEntries.forEach(d => {
    const melt = meltPerG1 ? meltPerG1 * d.mult : null;
    html += '<div class="denom-card">'
      + '<div class="denom-label">' + d.label + '</div>'
      + '<div class="denom-value">$' + fmt(d.value) + '</div>'
      + (melt ? '<div class="denom-sub">Melt: $' + fmt(melt) + '</div>' : "")
      + '<div class="denom-sub">' + d.mult + '/1000 oz</div>'
      + '</div>';
  });
  html += '</div>';

  html += '<div style="text-align:center;margin-top:10px;font-size:10px;color:var(--text-muted);">Source: ' + gb.source + ' &middot; ' + new Date(gb.t).toLocaleDateString() + '</div>';

  container.textContent = "";
  container.insertAdjacentHTML("beforeend", html);
}

// ============================================================
// 5. Best Price Ticker — CSS animated scroll
// ============================================================
function renderBestPriceTicker() {
  const wrapper = document.getElementById("bestPriceTicker");
  if (!retailData) { wrapper.textContent = ""; wrapper.insertAdjacentHTML("beforeend", '<div class="loading">No retail data</div>'); return; }

  const coins = retailData.data.coins;
  const spotPrices = spotData ? {} : null;
  if (spotData) Object.entries(spotData.data).forEach(([k, v]) => { spotPrices[k] = v.price; });

  const items = [];
  Object.entries(coins).forEach(([slug, c]) => {
    if (c.metal === "goldback") return;
    const detail = coinDetails[slug];
    if (!detail) return;
    const vendors = detail.data.vendors;
    let best = null, bestVid = "";
    Object.entries(vendors).forEach(([vid, v]) => {
      if (v.price > 0 && v.in_stock && (!best || v.price < best)) { best = v.price; bestVid = vid; }
    });
    if (!best) return;

    let premiumPct = null;
    if (spotPrices && spotPrices[c.metal]) {
      const spotForItem = spotPrices[c.metal] * (c.weight_oz || 1);
      premiumPct = ((best - spotForItem) / spotForItem * 100);
    }

    items.push({
      name: c.name.replace(/ 1 oz$/, "").replace(/ 10 oz.*$/, " 10oz").replace(/ \(.*\)$/, ""),
      vendor: shortVendor(bestVid),
      price: best,
      premium: premiumPct,
      metal: c.metal
    });
  });

  if (items.length === 0) { wrapper.textContent = ""; wrapper.insertAdjacentHTML("beforeend", '<div class="loading">No prices available</div>'); return; }

  const isStatic = items.length < 4;

  const buildItem = (i) => '<div class="ticker-item">'
    + '<span class="metal-dot" style="background:' + metalColor(i.metal) + ';width:8px;height:8px;"></span>'
    + '<span class="coin">' + i.name + '</span>'
    + '<span class="vendor">' + i.vendor + '</span>'
    + '<span class="price">$' + fmt(i.price) + '</span>'
    + (i.premium !== null ? '<span class="premium">' + i.premium.toFixed(1) + '%</span>' : "")
    + '</div>';

  let html;
  if (isStatic) {
    html = '<div class="ticker-track static">' + items.map(buildItem).join("") + '</div>';
  } else {
    const doubled = [...items, ...items];
    html = '<div class="ticker-track">' + doubled.map(buildItem).join("") + '</div>';
  }

  wrapper.textContent = "";
  wrapper.insertAdjacentHTML("beforeend", html);
}

loadAllData().catch(() => {
  document.getElementById("dataAge").textContent = "Error loading data";
  document.getElementById("dataAge").style.color = "var(--danger)";
});
