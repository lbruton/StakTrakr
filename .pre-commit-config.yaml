repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: check-signing-key
        name: Verify signing key is loaded
        entry: bash devops/hooks/check-signing-key.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: stamp-sw-cache
        name: Stamp service worker cache
        entry: bash devops/hooks/stamp-sw-cache.sh
        language: system
        files: ^(css/|js/|data/|images/|vendor/|index\.html|manifest\.json|sw\.js|privacy\.html)
        pass_filenames: false
      - id: check-release-sync
        name: Check release-artifact version sync
        entry: bash devops/hooks/check-release-sync.sh
        language: system
        pass_filenames: false
        files: ^(js/constants\.js|js/about\.js|version\.json|package\.json|CHANGELOG\.md)$
      - id: check-claude-md
        name: Verify CLAUDE.md exists (tracked by git; restore with git restore)
        entry: bash devops/hooks/check-claude-md.sh
        language: system
        pass_filenames: false
        always_run: true
      - id: lint-markdown
        name: Lint staged Markdown files
        entry: bash devops/hooks/lint-markdown-changed.sh --staged
        language: system
        pass_filenames: false
        files: \.md$
      - id: lint-staged
        name: Format staged files with prettier
        entry: npx lint-staged
        language: system
        pass_filenames: false
        always_run: true
