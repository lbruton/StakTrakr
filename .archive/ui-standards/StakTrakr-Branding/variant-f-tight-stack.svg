<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgF" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="silverF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="45%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldF" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92700c"/>
      <stop offset="45%" stop-color="#fcd34d"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgF)"/>
  <!-- S-stack — tighter gaps, more compact, taller bars -->
  <!-- Top of S -->
  <rect x="200" y="72" width="165" height="30" rx="15" fill="url(#silverF)" opacity="0.45"/>
  <rect x="162" y="112" width="128" height="30" rx="15" fill="url(#silverF)" opacity="0.65"/>
  <!-- Center gold -->
  <rect x="182" y="156" width="158" height="34" rx="17" fill="url(#goldF)"/>
  <!-- Bottom of S -->
  <rect x="222" y="200" width="128" height="30" rx="15" fill="url(#silverF)" opacity="0.65"/>
  <rect x="155" y="240" width="175" height="30" rx="15" fill="url(#silverF)" opacity="0.45"/>
  <!-- Divider line -->
  <rect x="170" y="296" width="172" height="1" fill="#334155"/>
  <!-- Wordmark — large and close to the S -->
  <text x="256" y="352" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="54" font-weight="800" letter-spacing="2">
    <tspan fill="#f8fafc">STAK</tspan><tspan fill="#d4a017">TRAKR</tspan>
  </text>
  <!-- Subtitle -->
  <text x="256" y="385" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#64748b" letter-spacing="3">PRECIOUS METALS TRACKER</text>
  <!-- Open source pill -->
  <rect x="190" y="406" width="132" height="22" rx="11" fill="none" stroke="#334155" stroke-width="1"/>
  <text x="256" y="421" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="10" fill="#475569" letter-spacing="1">FREE + OPEN SOURCE</text>
</svg>
