<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="coinSilver" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="coinGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fcd34d"/>
      <stop offset="50%" stop-color="#d4a017"/>
      <stop offset="100%" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="coinPlat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#c8d3e0"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg2)"/>
  <!-- Stacked coins — bottom to top, offset for 3D effect -->
  <!-- Coin 5 (bottom) — silver -->
  <ellipse cx="256" cy="310" rx="110" ry="28" fill="#64748b"/>
  <rect x="146" y="290" width="220" height="20" fill="#64748b"/>
  <ellipse cx="256" cy="290" rx="110" ry="28" fill="url(#coinSilver)"/>
  <!-- Coin 4 — silver -->
  <ellipse cx="256" cy="270" rx="110" ry="28" fill="#64748b"/>
  <rect x="146" y="250" width="220" height="20" fill="#64748b"/>
  <ellipse cx="256" cy="250" rx="110" ry="28" fill="url(#coinSilver)" opacity="0.9"/>
  <!-- Coin 3 — silver -->
  <ellipse cx="256" cy="230" rx="110" ry="28" fill="#64748b"/>
  <rect x="146" y="210" width="220" height="20" fill="#64748b"/>
  <ellipse cx="256" cy="210" rx="110" ry="28" fill="url(#coinSilver)" opacity="0.95"/>
  <!-- Coin 2 — gold -->
  <ellipse cx="256" cy="190" rx="110" ry="28" fill="#b8860b"/>
  <rect x="146" y="170" width="220" height="20" fill="#b8860b"/>
  <ellipse cx="256" cy="170" rx="110" ry="28" fill="url(#coinGold)"/>
  <!-- Coin 1 (top) — platinum highlight -->
  <ellipse cx="256" cy="150" rx="110" ry="28" fill="#8a99ab"/>
  <rect x="146" y="130" width="220" height="20" fill="#8a99ab"/>
  <ellipse cx="256" cy="130" rx="110" ry="28" fill="url(#coinPlat)"/>
  <!-- Inner ring detail on top coin -->
  <ellipse cx="256" cy="130" rx="80" ry="20" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.5"/>
  <ellipse cx="256" cy="130" rx="50" ry="13" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.3"/>
  <!-- Subtle upward arrow overlay -->
  <path d="M380 220 L400 180 L420 220" fill="none" stroke="#d4a017" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/>
  <line x1="400" y1="180" x2="400" y2="260" stroke="#d4a017" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <!-- Wordmark -->
  <text x="256" y="400" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="300" letter-spacing="6">
    <tspan fill="#e2e8f0">STAK</tspan><tspan fill="#d4a017">TRAKR</tspan>
  </text>
  <!-- Tagline -->
  <text x="256" y="430" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="14" fill="#64748b" letter-spacing="3" text-transform="uppercase">PRECIOUS METALS PORTFOLIO</text>
</svg>
