<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" width="400" height="80">
  <!-- Horizontal lockup: icon + wordmark for headers/navbars -->
  <defs>
    <linearGradient id="bgCompact" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="silverCompact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldCompact" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92700c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <!-- S-stack icon (left) -->
  <g transform="translate(8, 8) scale(0.125)">
    <rect x="170" y="68" width="215" height="38" rx="19" fill="url(#silverCompact)" opacity="0.45"/>
    <rect x="115" y="124" width="175" height="38" rx="19" fill="url(#silverCompact)" opacity="0.68"/>
    <rect x="140" y="186" width="240" height="44" rx="22" fill="url(#goldCompact)"/>
    <rect x="222" y="250" width="175" height="38" rx="19" fill="url(#silverCompact)" opacity="0.68"/>
    <rect x="127" y="306" width="230" height="38" rx="19" fill="url(#silverCompact)" opacity="0.45"/>
  </g>
  <!-- Wordmark (right) -->
  <text x="86" y="50" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="32" font-weight="700" letter-spacing="2">
    <tspan fill="#e2e8f0">STAK</tspan><tspan fill="#d4a017">TRAKR</tspan>
  </text>
</svg>
