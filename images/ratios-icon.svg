<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- STRK-272: Metal Ratios app icon — the balance-scale mark promoted from
       RATIO_CHIP_GLYPH (js/spot-ratio-chips.js). Gold pan vs silver pan = the
       gold-to-silver ratio. Sibling of icon-logo.svg: same background, corner
       radius, and metal gradients. -->
  <defs>
    <linearGradient id="bgRatios" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="silverRatios" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldRatios" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92700c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgRatios)"/>
  <g id="ratiosMark">
    <!-- structure: post, beam, base — muted silver like the secondary bars -->
    <g stroke="#a8b4c4" stroke-width="26" stroke-linecap="round" fill="none">
      <path d="M256 132v276"/>
      <path d="M112 160h288"/>
      <path d="M176 408h160"/>
    </g>
    <!-- finial -->
    <circle cx="256" cy="112" r="22" fill="url(#goldRatios)"/>
    <!-- left pan: GOLD -->
    <path d="M112 158 L48 282 A64 64 0 0 0 176 282 Z" fill="url(#goldRatios)"/>
    <!-- right pan: SILVER -->
    <path d="M400 158 L336 282 A64 64 0 0 0 464 282 Z" fill="url(#silverRatios)"/>
  </g>
</svg>
