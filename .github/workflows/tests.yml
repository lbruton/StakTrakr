name: Tests

# Unit and sharded core Playwright suites with V8 coverage. The `Tests` job merges
# the shards, uploads lcov to Codacy and publishes the test map that
# `npm run test:changed --fetch` downloads. `Tests` is the single check to require.

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read
  actions: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "26"
  CORE_SHARDS: 4

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:unit
        env:
          COVERAGE: "1"

      - name: Upload unit lcov
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: unit-lcov
          path: coverage/unit-lcov.info
          retention-days: 3
          if-no-files-found: warn

  core:
    name: Core (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run core shard with coverage
        run: npx playwright test tests/playwright/core --shard=${{ matrix.shard }}/${{ env.CORE_SHARDS }}
        env:
          COVERAGE: "1"

      - name: Upload blob report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report
          retention-days: 3
          if-no-files-found: warn

      - name: Upload raw coverage
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: raw-coverage-${{ matrix.shard }}
          path: coverage/raw
          retention-days: 3
          if-no-files-found: warn

  report:
    name: Tests
    if: ${{ !cancelled() }}
    needs: [unit, core]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download blob reports
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true

      - name: Download raw coverage
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: raw-coverage-*
          path: coverage/raw
          merge-multiple: true

      - name: Download unit lcov
        continue-on-error: true
        uses: actions/download-artifact@v8.0.2
        with:
          name: unit-lcov
          path: coverage

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter=json ./all-blob-reports > core-report.json

      - name: Write job summary
        run: |
          started=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .run_started_at)
          node devops/testing/ci-summary.mjs core-report.json "$started" >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Merge coverage and build the test map
        run: node devops/testing/coverage-merge.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Upload test map
        uses: actions/upload-artifact@v7.0.2
        with:
          name: test-map
          path: |
            .cache/test-map.json
            .cache/test-blocks.json
          retention-days: 30

      - name: Check for the Codacy token
        id: codacy
        run: echo "enabled=${{ secrets.CODACY_PROJECT_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage to Codacy
        if: ${{ steps.codacy.outputs.enabled == 'true' }}
        uses: codacy/codacy-coverage-reporter-action@v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage/lcov.info,coverage/unit-lcov.info

      - name: Note the skipped Codacy upload
        if: ${{ steps.codacy.outputs.enabled != 'true' }}
        run: |
          echo "Codacy coverage upload skipped: CODACY_PROJECT_TOKEN is not available to this run." >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when a suite failed
        if: ${{ needs.unit.result != 'success' || needs.core.result != 'success' }}
        run: |
          echo "Unit: ${{ needs.unit.result }}; core: ${{ needs.core.result }}."
          exit 1
