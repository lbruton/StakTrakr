name: Vale

on:
  pull_request:
    branches:
      - main
      - dev
    paths:
      - "README.md"
      - ".context/**"
      - ".vale.ini"
      - ".vale/**"

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  prose:
    name: Prose (warnings only)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vale
        uses: errata-ai/vale-action@v3.0.0
        with:
          version: 3.24.0
          files: README.md,.context
          separator: ","
          sync: false
          reporter: github-pr-check
          filter_mode: added
          fail_on_error: false
          fail_level: none
