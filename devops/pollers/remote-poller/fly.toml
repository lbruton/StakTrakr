# fly.toml — StakTrakr Thin Publisher (spot + publish + serve.js)
# Fly.io app configuration. Retail/goldback scraping handled by home poller.
# Full all-in-one config backed up as fly.toml.full.

app = 'staktrakr'
# Region is dfw — machine + volume have been pinned here since 2026-03-10.
# primary_region only matters for NEW machines; changing it does not migrate
# an existing volume. Keep this aligned with reality to avoid confusion.
primary_region = 'dfw'

[build]
  dockerfile = "Dockerfile"
  # Build context is parent dir (devops/pollers/) so Dockerfile can reach
  # both shared/ and remote-poller/ as sibling directories.
  context = ".."

[env]
  POLLER_ID = "api"
  API_DATA_REPO = "https://github.com/lbruton/StakTrakrApi.git"
  API_EXPORT_DIR = "/data/staktrakr-api-export"
  DATA_REPO_PATH = "/data/staktrakr-api-export"
  # Firecrawl still present in image (supervisord starts it) but unused
  # since retail/goldback crons are disabled via RETAIL_ENABLED=0.
  FIRECRAWL_BASE_URL = "http://localhost:3002"
  BROWSER_MODE = "local"
  PLAYWRIGHT_LAUNCH = "1"
  PLAYWRIGHT_BROWSERS_PATH = "/usr/local/share/playwright"
  HOME_PROXY_URL = ""

# HTTP service — serve.js on port 8080, proxied by Fly
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [http_service.concurrency]
    type = "requests"
    hard_limit = 250
    soft_limit = 200

[[mounts]]
  source = "staktrakr_data"
  destination = "/data"

[[vm]]
  # Thin publisher mode: spot prices + publish + serve.js.
  # No retail scraping — slim Dockerfile already drops Firecrawl/Playwright.
  # Profiled 2026-04-11: idle ~250MB, publish cycle peak well under 400MB.
  # 512MB is the Fly.io tier below 1024 (no 768 option) and leaves ~100MB
  # headroom over observed peak. Watch for OOM during git gc — rollback
  # with `fly releases rollback` if publisher misbehaves.
  memory = '512'
  cpu_kind = 'shared'
  cpus = 1
