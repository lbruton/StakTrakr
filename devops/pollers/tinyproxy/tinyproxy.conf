# tinyproxy — StakTrakr home proxy
# Accepts connections only from the Tailscale mesh (Fly.io container + localhost).
# Fly.io sets PROXY_SERVER=http://<home-tailnet-ip>:8888 to route scraper traffic
# through this residential IP while Turso/GitHub traffic stays on Fly's network.

User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 120
LogFile "/var/log/tinyproxy/tinyproxy.log"
LogLevel Info
MaxClients 50

# Tailscale peers (this VM and the Fly.io container) come from TINYPROXY_ALLOW
# in the stack env; entrypoint.sh appends one Allow line per address.
# Docker bridge (staktrakr-net subnet — verify with: docker network inspect staktrakr-net)
Allow 172.18.0.0/16
# Localhost (for local testing)
Allow 127.0.0.1
Allow ::1

# Strip Via header — don't advertise we're a proxy to target sites
DisableViaHeader Yes
