<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Market Premium Colour</title>
    <!-- Mockup for STRK-517: premium colour compares each dealer with the other dealers for the
         same item. The page loads itself in iframes (?frame) so the app's media queries see the
         frame width. The app stylesheet supplies tokens, themes and the shipped Market rules;
         proposal CSS is scoped under html.mk-p. Prices are the 2026-11-05 live capture from
         playground/STRK-515-market-phone.html; the Palladium tab rows are synthetic edge cases. -->
    <link rel="stylesheet" href="../css/styles.css" />
    <style>
      /* ---------- Shell (outer page) ---------- */
      html.mk-shell,
      html.mk-shell body {
        background: var(--bg-primary);
        color: var(--text-primary);
        font-family: var(--font-body);
        margin: 0;
        max-width: none;
      }
      .mk-controls {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 0.6rem 1.5rem;
        align-items: center;
        padding: 0.6rem 1rem;
        background: var(--bg-tertiary);
        border-bottom: 1px solid var(--border);
        font-size: 13px;
      }
      .mk-controls fieldset {
        border: 0;
        margin: 0;
        padding: 0;
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem;
        align-items: center;
      }
      .mk-controls fieldset[hidden] {
        display: none;
      }
      .mk-controls legend {
        float: left;
        margin-right: 0.4rem;
        color: var(--text-secondary);
        font-weight: 500;
      }
      .mk-controls button {
        font: inherit;
        padding: 0.3rem 0.7rem;
        border-radius: 999px;
        border: 1px solid var(--border);
        background: var(--bg-secondary);
        color: var(--text-primary);
        cursor: pointer;
      }
      .mk-controls button[aria-pressed="true"] {
        background: var(--bg-primary);
        border: 2px solid var(--primary);
        font-weight: 600;
      }
      .mk-stage {
        display: flex;
        flex-wrap: wrap;
        gap: 2rem;
        justify-content: center;
        padding: 1.5rem 1rem;
      }
      .mk-pane {
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
        align-items: center;
        max-width: 100%;
      }
      .mk-pane h2 {
        margin: 0;
        font-family: var(--font-heading);
        font-weight: 400;
        font-size: 1.25rem;
      }
      .mk-pane p {
        margin: 0;
        color: var(--text-secondary);
        font-size: 13px;
      }
      .mk-pane iframe {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--bg-primary);
        height: 860px;
        max-width: calc(100vw - 2rem);
      }
      .mk-stats {
        font-family: var(--font-mono);
        font-size: 12px;
      }
      .mk-notes {
        max-width: 900px;
        margin: 0 auto 3rem;
        padding: 0 1.5rem;
        color: var(--text-secondary);
        font-size: 14px;
        line-height: 1.6;
      }
      .mk-notes h2 {
        font-family: var(--font-heading);
        font-weight: 400;
        color: var(--text-primary);
      }
      .mk-notes li {
        margin-bottom: 0.35rem;
      }
      .mk-notes code {
        font-family: var(--font-mono);
        font-size: 12px;
      }

      /* ---------- Frame (inside the iframe) ---------- */
      html.mk-frame body {
        margin: 0;
        padding: 8px;
        max-width: none;
        background: var(--bg-primary);
      }
      .mk-chart-placeholder {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
        border: 1px dashed var(--border);
        border-radius: 8px;
        color: var(--text-muted);
        font-size: 12px;
      }
      .mk-chart-placeholder svg {
        width: 100%;
        height: 100%;
      }

      /* =====================================================================
         Proposal. Every rule maps to a STRK-517 plan step.
         ===================================================================== */

      /* Plan 2: a price with no comparison (one dealer in stock, or carried) takes the plain ink. */
      .mk-p .vp-premium.plain {
        color: var(--text-secondary);
      }
      /* Optional non-colour cue: a triangle before a premium below or above the band. */
      .mk-p .mk-cue {
        display: inline-block;
        width: 0.8em;
        font-size: 0.85em;
      }

      /* Plan 3: one legend line states what the colour means. */
      .mk-p .vp-legend {
        display: flex;
        flex-wrap: wrap;
        gap: 0.25rem 0.9rem;
        align-items: baseline;
        margin: 0.5rem 0 0.6rem;
        font-size: max(12px, var(--font-size-xs));
        color: var(--text-secondary);
        line-height: 1.4;
      }
      .mk-p .vp-legend-lead {
        flex-basis: 100%;
      }
      .mk-p .vp-legend .vp-premium {
        display: inline;
        margin: 0;
        font-weight: 600;
      }
      .mk-p .market-detail-modal .vp-legend {
        margin-top: 0.75rem;
      }
      [data-theme="sepia"].mk-p .vp-legend {
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <script>
      const params = new URLSearchParams(location.search);
      const FRAME = params.has("frame");
      const doc = document.documentElement;

      /* ---------- Captured live data (2026-11-05, 16:59 CT) ---------- */
      const VENDORS = [
        ["APMEX", "apmex"],
        ["BullionX", "bullionexchanges"],
        ["Gville", "gainesvillecoins"],
        ["Hero", "herobullion"],
        ["JM", "jmbullion"],

        ["Monument", "monumentmetals"],

      ];
      // [name, metal, cells[9], feedMedian]; cell = [price, premiumPct, carried] | "O" (OOS) | 0 (not listed)
      // prettier-ignore
      const ROWS = [["American Gold Buffalo 1 oz","xau",[[4424.29,8.2,0],[4310.52,5.4,0],[4222.97,3.3,0],"O",[4410.99,7.9,0],[4238.4,3.7,0],[4341.88,6.2,0],"O",[4443.85,8.7,0]],4341.88],["American Gold Eagle 1 oz","xau",[[4324.29,5.8,0],[4298.22,5.1,0],[4161.47,1.8,0],"O",[4352.93,6.5,0],[4301.45,5.2,0],[4269.6,4.4,0],[4258.96,4.2,0],[4383.95,7.2,0]],4301.45],["American Gold Eagle 1/10 oz","xau",[[499.92,22.3,0],[471.43,15.3,0],[456.12,11.6,0],"O",[514.78,25.9,0],[457.01,11.8,0],[470.18,15,0],[479.58,17.3,0],[471.17,15.3,0]],471.43],["Australian Gold Kangaroo 1/10 oz","xau",[[484.9,18.6,0],"O",0,"O",[485.39,18.7,0],0,[456.24,11.6,0],[483.68,18.3,0],[482.26,18,0]],483.68],["Australian Gold Kookaburra 1/10 oz","xau",[[530.92,29.9,0],"O",0,[447.39,9.4,0],"O",0,[447.98,9.6,0],"O",[471.5,15.3,0]],471.5],["Canadian Gold Maple Leaf 1 oz","xau",[[4274.29,4.6,0],[4159.39,1.7,0],[4119.96,0.8,0],"O",[4105.64,0.4,0],[4137.39,1.2,0],[4180.7,2.3,0],[4208.96,3,0],[4248.18,3.9,0]],4180.7],["Canadian Gold Maple Leaf 1/10 oz","xau",[[493.12,20.6,0],"O",[438.7,7.3,0],[463.47,13.4,0],[553.8,35.5,0],[446.19,9.1,0],[447.98,9.6,0],[471.38,15.3,0],[469.59,14.9,0]],469.59],["South African Gold Krugerrand 1 oz","xau",[[4259.29,4.2,0],[4144.39,1.4,0],[4118.97,0.8,0],"O","O",0,[4147.7,1.5,0],[4168.96,2,0],[4167.44,1.9,0]],4167.44],["American Silver Eagle 1 oz","xag",[[61.68,19.1,0],[57.8,11.6,0],[57.1,10.3,0],[59.15,14.2,0],[69.44,34.1,0],[56.35,8.8,0],[58.44,12.8,0],[61.42,18.6,0],[59.02,14,0]],59.02],["Australian Silver Kangaroo 1 oz","xag",[[61.68,19.1,0],[55.65,7.5,0],0,[56.37,8.8,0],[63.96,23.5,0],[55.59,7.3,0],[56.24,8.6,0],[58.92,13.8,0],"O"],56.37],["Australian Silver Koala 1 oz","xag",[[65.68,26.8,0],"O",0,[58.99,13.9,0],[64.16,23.9,0],0,[57.74,11.5,0],[61.42,18.6,0],"O"],61.42],["Australian Silver Kookaburra 1 oz","xag",[[69.69,34.6,0],"O",0,[59.81,15.5,0],[67.91,31.1,0],[63.09,21.8,0],[58.44,12.8,0],[63.42,22.5,0],[60.6,17,0]],63.09],["British Silver Britannia 1 oz","xag",[[62.68,21,0],"O",0,"O",[56.48,9.1,0],[54.5,5.2,0],[56.34,8.8,0],[58.42,12.8,0],[58.79,13.5,0]],58.42],["Canadian Silver Maple Leaf 1 oz","xag",[[63.68,23,0],[56.9,9.9,0],[54.11,4.5,0],"O",[64.02,23.6,0],[55.8,7.7,0],[57.5,11,0],[59.92,15.7,0],[58.34,12.6,0]],58.34],["Generic Silver Bar 10 oz (.999)","xag",[[606.8,17.2,0],[537,3.7,0],[563.6,8.8,0],"O",0,[527.4,1.8,0],[546.4,5.5,0],"O",[567.89,9.7,0]],563.6],["Generic Silver Round 1 oz (.999)","xag",[[60.68,17.2,0],[54.4,5,0],[52.36,1.1,0],[55.62,7.4,0],0,[52.84,2,0],[55.2,6.6,0],[57.42,10.9,0],"O"],55.2],["South African Silver Krugerrand 1 oz","xag",[[62.68,21,0],"O",0,[56.74,9.6,0],"O",[54.35,4.9,0],[56.3,8.7,0],[57.42,10.9,0],"O"],56.74],["American Platinum Eagle 1 oz","xpt",[[1877.59,23.7,0],"O",0,[1673.05,10.2,0],[1868.69,23.1,0],[1669.5,10,0],[1667.35,9.8,0],[1825.69,20.3,0],[1721.85,13.4,0]],1721.85],["G1 Arizona Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,"O",0,0,0,[7.84,-5,0],0],7.84],["G1 Florida Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,[8.81,6.8,0],0,0,0,"O",0],8.01],["G1 Nevada Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,[8.81,6.8,0],0,0,0,"O",0],8.01],["G1 New Hampshire Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.85,-4.8,1],0,[8.81,6.8,0],0,0,0,[7.84,-5,0],0],8.01],["G1 Oklahoma Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,[8.81,6.8,0],0,0,0,[7.84,-5,0],0],8.01],["G1 South Dakota Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,[8.81,6.8,0],0,0,0,[7.84,-5,0],0],8.01],["G1 Utah Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,"O",0,0,0,[7.84,-5,0],0],7.84],["G1 Wyoming Goldback (1/1000 oz gold)","goldback",[[8.01,-2.9,0],[7.83,-5.1,0],0,[8.81,6.8,0],0,0,0,[7.84,-5,0],0],8.01]];
      // Synthetic edge cases on the Palladium tab (not from the feed).
      // prettier-ignore
      ROWS.push(
        ["Edge: one dealer in stock", "xpd", [[1189.5, 9.4, 0], "O", 0, "O", 0, 0, "O", 0, 0], 1189.5],
        ["Edge: two dealers in stock", "xpd", [[1172.2, 7.8, 0], 0, 0, 0, [1214.9, 11.7, 0], 0, "O", 0, 0], 1193.55],
        ["Edge: one in stock plus a carried price", "xpd", [[1180.0, 8.5, 0], 0, 0, 0, 0, 0, [1150.0, 5.8, 1], 0, "O"], 1165.0],
        ["Edge: tight spread (all within 0.6%)", "xpd", [[1176.0, 8.2, 0], [1178.4, 8.4, 0], [1179.9, 8.5, 0], 0, [1181.1, 8.6, 0], [1182.6, 8.8, 0], 0, 0, [1183.0, 8.8, 0]], 1180.5],
        ["Edge: all out of stock", "xpd", ["O", "O", 0, "O", 0, 0, "O", 0, 0], null]
      );
      const METALS = [
        ["all", "All"],
        ["xau", "Gold"],
        ["xag", "Silver"],
        ["xpt", "Platinum"],
        ["xpd", "Palladium"],
        ["goldback", "Goldback"],
      ];
      const MODAL_ITEM = "American Gold Eagle 1 oz";

      const money = (n) =>
        "$" + n.toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      const pct = (n) => (n >= 0 ? "+" : "") + n.toFixed(1) + "%";
      const median = (list) => {
        const a = [...list].sort((x, y) => x - y);
        const m = a.length >> 1;
        return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
      };

      /**
       * The proposed tier function. Reference: the median of in-stock, non-carried prices.
       * Returns one entry per cell: { tier, dist } or null for OOS and unlisted cells.
       */
      function tierRow(cells, opt) {
        const live = cells.filter((c) => Array.isArray(c) && !c[2]).map((c) => c[0]);
        const ref = live.length ? median(live) : null;
        const sorted = [...live].sort((a, b) => a - b);
        const tiers = cells.map((c) => {
          if (!Array.isArray(c)) return null;
          const [price, prem, carried] = c;
          if (opt.v === "current") {
            return { tier: prem >= 5 ? "high" : prem >= 2 ? "mid" : "low", dist: null };
          }
          if (carried || live.length < 2)
            return { tier: "plain", dist: null, why: carried ? "carried" : "single" };
          const dist = ((price - ref) / ref) * 100;
          let tier;
          if (opt.v === "a") {
            tier = dist <= -opt.band ? "low" : dist >= opt.band ? "high" : "mid";
          } else {
            const pos = sorted.indexOf(price) / (sorted.length - 1);
            tier = pos < 1 / 3 ? "low" : pos > 2 / 3 ? "high" : "mid";
          }
          if (tier === "mid" && opt.mid === "plain") tier = "plain";
          return { tier, dist };
        });
        return { ref, low: sorted[0] ?? null, high: sorted[sorted.length - 1] ?? null, tiers };
      }

      function frameOpts() {
        return {
          v: params.get("v") || "current",
          band: parseFloat(params.get("band") || "1"),
          mid: params.get("mid") || "amber",
          cue: params.get("cue") || "none",
          med: params.get("med") || "instock",
          legend: params.get("legend") || "off",
        };
      }

      if (FRAME) renderFrame();
      else renderShell();

      /* ---------- Frame: one rendering of the Market tab ---------- */
      function renderFrame() {
        const opt = frameOpts();
        const metal = params.get("metal") || "all";
        doc.classList.add("mk-frame");
        if (opt.v !== "current") doc.classList.add("mk-p");
        doc.setAttribute("data-theme", params.get("theme") || "dark");

        const rows = ROWS.filter((r) => metal === "all" || r[1] === metal);
        const tabs = METALS.map(
          ([key, label]) =>
            `<button type="button" class="vp-tab${key === metal ? " active" : ""}" data-metal="${key}" aria-pressed="${key === metal}">${label}</button>`
        ).join("");
        const head =
          `<th scope="col">ITEM</th>` +
          VENDORS.map(([label]) => `<th scope="col">${label}</th>`).join("") +
          `<th scope="col">MEDIAN</th><th scope="col">SPREAD</th>`;
        const built = rows.map((r) => ({ r, t: tierRow(r[2], opt) }));
        const medianText = ({ r, t }) => {
          const useFeed = opt.v === "current" || opt.med === "feed";
          const val = useFeed ? r[3] : t.ref;
          return val != null ? money(val) : "—";
        };
        const spreadText = ({ t }) =>
          t.low != null && t.high !== t.low ? money(t.high - t.low) : "—";
        const body = built
          .map(
            (b) =>
              `<tr><td><button type="button" class="vp-coin-link" aria-haspopup="dialog">${b.r[0]}</button></td>${b.r[2]
                .map((c, i) => `<td${cellClass(c, b.t)}>${cellInner(b.r[0], c, i, b.t, opt)}</td>`)
                .join("")}<td>${medianText(b)}</td><td>${spreadText(b)}</td></tr>`
          )
          .join("");
        const cards = built.map((b) => card(b, opt, medianText(b), spreadText(b))).join("");
        const legend = opt.v === "current" || opt.legend !== "on" ? "" : legendHtml(opt);
        const disclaimer =
          opt.v === "current"
            ? "Market prices are best effort. Percentages show premium over spot (or G1 rate for Goldbacks)."
            : "Market prices are best effort. Percentages show premium over spot (or G1 rate for Goldbacks); their colour compares dealers.";

        document.body.innerHTML = `
          <section class="vendor-prices-section" id="vendorPricesSectionEl">
            <div id="vendorPricesContainer">
              <div class="market-block-header">
                <h2 class="market-block-title">Market prices</h2>
                <div class="market-block-actions">
                  <span class="market-block-status" aria-live="polite"><span id="marketDataTimestamp">Updated 2026-11-05, 04:59 p.m.</span><span id="marketFreshnessStatus" class="market-freshness market-freshness--current">Current</span></span>
                  <button id="marketRefreshBtn" type="button" aria-label="Refresh market prices" class="market-block-btn">↻ Refresh</button>
                  <button id="marketSettingsBtn" type="button" aria-label="Market settings" class="market-block-btn">⚙</button>
                </div>
              </div>
              <div class="vendor-prices-tabs" role="group" aria-label="Metal">${tabs}</div>
              ${legend}
              <div class="vp-table-area">
                <div class="vp-scroll"><table class="vendor-prices-table"><caption class="sr-only">Dealer prices</caption><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table></div>
                <ul class="vp-cards">${cards}</ul>
              </div>
              <div class="market-disclaimer">${disclaimer} Prices are sourced directly from vendors when possible, or provided by <a href="https://findbullionprices.com" target="_blank" rel="noopener noreferrer">findbullionprices.com</a></div>
            </div>
          </section>
          ${params.get("view") === "modal" ? modal(opt) : ""}`;

        document.querySelectorAll(".vp-tab").forEach((b) =>
          b.addEventListener("click", () => {
            params.set("metal", b.dataset.metal);
            location.search = params.toString();
          })
        );
        window.mkStats = () => stats(built);
      }

      function legendHtml(opt) {
        const cue = (g) =>
          opt.cue === "tri" ? `<span class="mk-cue" aria-hidden="true">${g}</span>` : "";
        const midClass = opt.mid === "plain" ? "plain" : "mid";
        const [lo, mid, hi] =
          opt.v === "a"
            ? [`${opt.band}% or more below`, `within ${opt.band}%`, `${opt.band}% or more above`]
            : ["cheapest third", "middle third", "dearest third"];
        const lead =
          opt.v === "a"
            ? "Premium colour compares each price with the median of the dealers that have the item in stock."
            : "Premium colour ranks each price against the dealers that have the item in stock.";
        return `<p class="vp-legend"><span class="vp-legend-lead">${lead}</span><span class="vp-premium low">${cue("▾")}${lo}</span><span class="vp-premium ${midClass}">${mid}</span><span class="vp-premium high">${cue("▴")}${hi}</span><span>No colour with one dealer in stock or a carried price.</span></p>`;
      }

      function cellClass(c, t) {
        if (c === "O") return ' class="vp-oos"';
        if (!c) return ' class="vp-muted"';
        const best = !c[2] && c[0] === t.low;
        const cls = [best ? "vp-best" : "", c[2] ? "vp-carried" : ""].filter(Boolean).join(" ");
        return cls ? ` class="${cls}"` : "";
      }

      function premiumSpan(tierInfo, prem, opt) {
        const g =
          opt.cue === "tri" && opt.v !== "current"
            ? tierInfo.tier === "low"
              ? "▾"
              : tierInfo.tier === "high"
                ? "▴"
                : ""
            : "";
        const cue = g ? `<span class="mk-cue" aria-hidden="true">${g}</span>` : "";
        return `<span class="vp-premium ${tierInfo.tier}">${cue}${pct(prem)}</span>`;
      }

      function ariaFor(name, c, i, tierInfo, opt) {
        const base = `${name} at ${VENDORS[i][0]}, ${money(c[0])}, premium ${pct(c[1])}`;
        if (opt.v === "current") return base;
        let rel = "";
        if (tierInfo.why === "single") rel = ", the only dealer in stock";
        else if (tierInfo.dist != null) {
          const d = Math.abs(tierInfo.dist);
          rel =
            d < 0.05
              ? ", at the dealer median"
              : `, ${d.toFixed(1)}% ${tierInfo.dist < 0 ? "below" : "above"} the dealer median`;
        }
        return `${base}${rel}. Opens the dealer page in a new window.`;
      }

      function cellInner(name, c, i, t, opt) {
        if (c === "O") return "<span>OOS</span>";
        if (!c) return "—";
        const ti = t.tiers[i];
        const carried = c[2]
          ? `<span class="vp-carried-mark">Carried</span><span class="vp-carried-date">2026-11-04</span>`
          : "";
        return `<button class="vp-price" type="button" aria-label="${ariaFor(name, c, i, ti, opt)}">${money(c[0])}</button>${premiumSpan(ti, c[1], opt)}${carried}`;
      }

      function card(b, opt, medText, sprText) {
        const dealers = b.r[2]
          .map((c, i) => {
            if (!c) return "";
            const [label, key] = VENDORS[i];
            const vendor = `<span class="vp-card-vendor"><span class="vp-card-vendor-dot" aria-hidden="true" style="color: var(--vendor-${key});"></span>${label}</span>`;
            const cls = cellClass(c, b.t).replace(' class="', "").replace('"', "");
            return `<li class="vp-card-dealer ${cls}">${vendor}${cellInner(b.r[0], c, i, b.t, opt)}</li>`;
          })
          .join("");
        return `<li class="vp-card"><button type="button" class="vp-coin-link" aria-haspopup="dialog">${b.r[0]}</button><p class="vp-card-meta"><span>Median <b>${medText}</b></span><span>Spread <b>${sprText}</b></span></p><ul class="vp-card-dealers">${dealers}</ul></li>`;
      }

      function modal(opt) {
        const row = ROWS.find((r) => r[0] === MODAL_ITEM);
        const t = tierRow(row[2], opt);
        const entries = row[2]
          .map((c, i) => ({ c, i }))
          .filter(({ c }) => c)
          .sort(
            (a, b) => (Array.isArray(a.c) ? a.c[0] : 1e9) - (Array.isArray(b.c) ? b.c[0] : 1e9)
          );
        const rows = entries
          .map(({ c, i }) => {
            const [label, key] = VENDORS[i];
            const inStock = Array.isArray(c);
            const word = inStock ? "In Stock" : "Out of Stock";
            const stock = inStock ? "in" : "out";
            const premCell = inStock
              ? `<td>${premiumSpan(t.tiers[i], c[1], opt)}</td>`
              : `<td class="vp-muted">—</td>`;
            return `<tr><td style="color: var(--vendor-${key});">${label}<span class="market-stock market-stock--${stock} market-stock-sub">${word}</span></td><td class="market-price">${inStock ? money(c[0]) : "—"}</td>${premCell}<td class="market-stock market-stock--${stock} market-detail-stock-col">${word}</td><td>${inStock ? `<button type="button" class="market-detail-buy" aria-label="Buy at ${label}">Buy</button>` : "—"}</td></tr>`;
          })
          .join("");
        const periods = ["24H", "7D", "30D", "60D", "90D"]
          .map(
            (p) =>
              `<button type="button" class="chip-sort-btn market-detail-period-btn${p === "7D" ? " active" : ""}" aria-pressed="${p === "7D"}">${p}</button>`
          )
          .join("");
        const lines = [
          "M0,60 L40,58 L80,62 L120,50 L160,48 L200,52 L240,44 L280,46 L318,40",
          "M0,90 L40,92 L80,88 L120,95 L160,90 L200,86 L240,88 L280,84 L318,82",
          "M0,140 L40,132 L80,136 L120,128 L160,130 L200,126 L240,120 L280,124 L318,118",
        ];
        const colors = ["--vendor-apmex", "--vendor-jmbullion", "--vendor-gainesvillecoins"];
        const svg = `<svg viewBox="0 0 318 200" preserveAspectRatio="none" aria-hidden="true">${lines.map((d, i) => `<path d="${d}" fill="none" stroke="var(${colors[i]})" stroke-width="2"/>`).join("")}</svg>`;
        const legend = opt.v === "current" || opt.legend !== "on" ? "" : legendHtml(opt);
        return `
          <div class="market-detail-overlay" role="dialog" aria-modal="true" aria-labelledby="marketDetailTitle">
            <div class="market-detail-modal" tabindex="-1">
              <button type="button" class="market-detail-close" aria-label="Close modal">×</button>
              <div id="marketDetailContent">
                <div class="market-detail-header"><h2 id="marketDetailTitle" tabindex="-1"><span class="metal-dot xau"></span> ${MODAL_ITEM}</h2><div class="market-detail-weight">1 oz Gold</div><div class="market-detail-asof">Prices from 2026-11-05, 04:45 p.m.</div></div>
                <div class="market-detail-summary"><div><div class="market-detail-stat-label">Median</div><div class="market-value">${money(t.ref)}</div></div><div><div class="market-detail-stat-label">Low</div><div class="market-value">${money(t.low)}</div></div><div><div class="market-detail-stat-label">High</div><div class="market-value">${money(t.high)}</div></div><div><div class="market-detail-stat-label">Spread</div><div class="market-value">${money(t.high - t.low)}</div></div></div>
                <div class="market-detail-chart-section"><div class="chip-sort-toggle market-detail-periods" role="group" aria-label="Vendor history period">${periods}</div><div class="market-detail-chart" role="group" aria-label="Vendor price history chart"><div class="mk-chart-placeholder">${svg}</div></div></div>
                ${legend}
                <div class="vp-scroll"><table class="vendor-prices-table market-detail-vendors"><thead><tr><th>Vendor</th><th>Price</th><th>Premium</th><th class="market-detail-stock-col">Stock</th><th>Buy</th></tr></thead><tbody>${rows}</tbody></table></div>
              </div>
            </div>
          </div>`;
      }

      /* Tier counts across the rendered rows, for the shell readout. */
      function stats(built) {
        const n = { low: 0, mid: 0, high: 0, plain: 0 };
        for (const { t } of built) for (const x of t.tiers) if (x) n[x.tier]++;
        return n;
      }

      /* ---------- Shell: controls and side-by-side frames ---------- */
      function renderShell() {
        doc.classList.add("mk-shell");
        const state = {
          theme: "dark",
          width: "1100",
          view: "table",
          v: "a",
          band: "1",
          mid: "amber",
          cue: "none",
          med: "instock",
          legend: "off",
        };
        document.body.innerHTML = `
          <div class="mk-controls">
            <fieldset data-key="theme"><legend>Theme</legend>${opts(["dark", "light", "slate", "sepia"])}</fieldset>
            <fieldset data-key="width"><legend>Width</legend>${opts([
              ["1100", "Desktop"],
              ["768", "768"],
              ["390", "Phone"],
            ])}</fieldset>
            <fieldset data-key="view"><legend>View</legend>${opts([
              ["table", "Table"],
              ["modal", "Detail modal"],
            ])}</fieldset>
            <fieldset data-key="v"><legend>Proposal</legend>${opts([
              ["a", "A: Distance from median"],
              ["b", "B: Rank in thirds"],
            ])}</fieldset>
            <fieldset data-key="band" id="mkBand"><legend>A band</legend>${opts([
              ["0.5", "±0.5%"],
              ["1", "±1%"],
              ["2", "±2%"],
            ])}</fieldset>
            <fieldset data-key="mid"><legend>Middle</legend>${opts([
              ["amber", "Amber"],
              ["plain", "Plain ink"],
            ])}</fieldset>
            <fieldset data-key="legend"><legend>Legend</legend>${opts([
              ["off", "None"],
              ["on", "Show"],
            ])}</fieldset>
            <fieldset data-key="cue"><legend>Marks</legend>${opts([
              ["none", "None"],
              ["tri", "▾ ▴"],
            ])}</fieldset>
            <fieldset data-key="med"><legend>Median column</legend>${opts([
              ["instock", "In-stock median"],
              ["feed", "Feed median"],
            ])}</fieldset>
          </div>
          <div class="mk-stage">
            <div class="mk-pane"><h2>Current</h2><p>dev at v3.36.107: 5% and 2% over spot</p><p class="mk-stats" id="mkStatsCurrent"></p><iframe id="mkCurrent" title="Current Market tab"></iframe></div>
            <div class="mk-pane"><h2 id="mkPropTitle">Proposed</h2><p id="mkPropNote">STRK-517</p><p class="mk-stats" id="mkStatsProposed"></p><iframe id="mkProposed" title="Proposed Market tab"></iframe></div>
          </div>
          <div class="mk-notes">
            <h2>STRK-517: what changes</h2>
            <ul>
              <li>The premium number stays premium over spot (or the G1 rate for Goldbacks). Only its colour changes meaning: it compares the price with the other dealers for the same item.</li>
              <li>Reference: the median of the in-stock, non-carried prices in the row. Out-of-stock cells, unlisted cells and carried prices do not count.</li>
              <li><b>A: distance from the median.</b> Green at the band or more below the median, red at the band or more above it, the middle colour in between. At ±1% the live capture splits into about even thirds (50 low, 45 middle, 53 high of 148 in-stock cells). A tight row stays in the middle colour, so red always means a real gap.</li>
              <li><b>B: rank in thirds.</b> The cheapest third is green, the dearest third red, whatever the gap. Every row shows red even when all dealers are within cents (see the tight-spread row on the Palladium tab).</li>
              <li>One dealer in stock, or a carried price: the premium takes the plain secondary ink. A carried price keeps its Carried label and date.</li>
              <li>No legend line. The disclaimer names the rule in one clause ("their colour compares dealers"), and each price button's accessible name adds the distance ("1.8% above the dealer median"). The Legend and ▾ ▴ controls stay here for comparison only.</li>
              <li>The detail modal vendor table uses the same tiers.</li>
              <li>Colours stay the <code>--success-text</code>, <code>--warning-text</code> and <code>--danger-text</code> tokens from STRK-514; plain uses <code>--text-secondary</code>.</li>
            </ul>
            <h2>Found while building the mockup</h2>
            <ul>
              <li>The Median column is not the row median the issue names. It is the feed's <code>median_price</code>, which differs from the in-stock median in 12 of the 26 live rows (for example, Kookaburra 1/10 oz: feed $471.50, in stock $459.74). If the colour compares against one median and the column shows another, a price just under the shown median can be red. The "Median column" control shows both. Proposal: the column, the card line and the modal summary all show the in-stock median that the colour uses. That also settles one of the three Medians in STRK-518.</li>
            </ul>
            <h2>Decision</h2>
            <ul>
              <li>Approved 2026-11-05: A at ±1% from the in-stock median, middle band in amber, no legend line, no ▾ ▴ marks.</li>
              <li>B, plain ink for the middle band, the legend line and the marks are not built. They stay here for comparison.</li>
              <li>Approved 2026-11-05: the Median column and the phone card line show the in-stock median that the colour uses, not the feed median. The detail modal summary keeps the median over the selected history period, because its Low, High and Spread are period figures too.</li>
            </ul>
            <p>The chart in the modal is a placeholder. The Palladium tab rows are synthetic edge cases; every other price is the live capture from 2026-11-05.</p>
          </div>`;
        document.querySelectorAll(".mk-controls fieldset").forEach((fs) =>
          fs.addEventListener("click", (e) => {
            const b = e.target.closest("button");
            if (!b) return;
            state[fs.dataset.key] = b.dataset.val;
            apply();
          })
        );
        function apply() {
          document
            .querySelectorAll(".mk-controls fieldset")
            .forEach((fs) =>
              fs
                .querySelectorAll("button")
                .forEach((b) =>
                  b.setAttribute("aria-pressed", String(state[fs.dataset.key] === b.dataset.val))
                )
            );
          document.getElementById("mkBand").hidden = state.v !== "a";
          doc.setAttribute("data-theme", state.theme);
          const q = (v) => {
            const p = new URLSearchParams({ ...state, v });
            return `?frame&${p.toString()}`;
          };
          for (const [id, v, statId] of [
            ["mkCurrent", "current", "mkStatsCurrent"],
            ["mkProposed", state.v, "mkStatsProposed"],
          ]) {
            const f = document.getElementById(id);
            f.style.width = state.width + "px";
            f.onload = () => {
              const s = f.contentWindow.mkStats && f.contentWindow.mkStats();
              if (s)
                document.getElementById(statId).textContent =
                  `low ${s.low} · middle ${s.mid} · high ${s.high} · plain ${s.plain}`;
            };
            f.src = q(v);
          }
          document.getElementById("mkPropTitle").textContent =
            state.v === "a"
              ? `Proposed A: ±${state.band}% from the median`
              : "Proposed B: rank in thirds";
        }
        apply();
      }

      function opts(list) {
        return list
          .map((o) => {
            const [val, label] = Array.isArray(o) ? o : [o, o];
            return `<button type="button" data-val="${val}">${label}</button>`;
          })
          .join("");
      }
    </script>
  </body>
</html>
