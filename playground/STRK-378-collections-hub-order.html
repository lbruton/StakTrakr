<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>STRK-378 · Collections hub order playground</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: dark;
        --primary: oklch(0.72 0.16 75);
        --bg-primary: oklch(0.19 0.025 260);
        --bg-secondary: oklch(0.235 0.03 260);
        --bg-tertiary: oklch(0.29 0.035 260);
        --text-primary: oklch(0.94 0.012 255);
        --text-secondary: oklch(0.79 0.018 255);
        --text-muted: oklch(0.62 0.025 255);
        --border: oklch(0.38 0.028 260);
        --success: oklch(0.73 0.15 155);
        --danger: oklch(0.72 0.17 25);
        --hover-mix: var(--primary);
        --radius: 8px;
        --radius-lg: 12px;
      }
      [data-theme="light"] {
        color-scheme: light;
        --primary: oklch(0.52 0.15 260);
        --bg-primary: oklch(0.98 0.008 255);
        --bg-secondary: oklch(1 0 0);
        --bg-tertiary: oklch(0.95 0.012 255);
        --text-primary: oklch(0.22 0.025 260);
        --text-secondary: oklch(0.38 0.025 260);
        --text-muted: oklch(0.53 0.022 260);
        --border: oklch(0.85 0.015 260);
        --success: oklch(0.5 0.14 155);
        --danger: oklch(0.55 0.17 25);
      }
      [data-theme="slate"] {
        color-scheme: dark;
        --primary: #3b82f6;
        --bg-primary: #0f172a;
        --bg-secondary: #1e293b;
        --bg-tertiary: #334155;
        --text-primary: #f8fafc;
        --text-secondary: #cbd5e1;
        --text-muted: #94a3b8;
        --border: #475569;
        --success: #10b981;
        --danger: #ef4444;
      }
      [data-theme="sepia"] {
        color-scheme: light;
        --primary: oklch(0.55 0.12 55);
        --bg-primary: oklch(0.95 0.035 80);
        --bg-secondary: oklch(0.98 0.025 80);
        --bg-tertiary: oklch(0.91 0.035 80);
        --text-primary: oklch(0.28 0.04 55);
        --text-secondary: oklch(0.4 0.035 55);
        --text-muted: oklch(0.54 0.03 55);
        --border: oklch(0.79 0.04 75);
        --success: oklch(0.48 0.11 145);
        --danger: oklch(0.55 0.15 25);
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        padding: 28px 18px 52px;
        background: var(--bg-primary);
        color: var(--text-primary);
        font:
          15px/1.5 system-ui,
          sans-serif;
      }
      button,
      select {
        font: inherit;
      }
      .app {
        max-width: 1180px;
        margin: auto;
      }
      .preview-tools {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-bottom: 20px;
      }
      .preview-tools select {
        min-height: 38px;
        max-width: 180px;
      }
      .hub-head {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 16px;
        margin-bottom: 22px;
      }
      h1 {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 0;
        font-size: clamp(1.55rem, 4vw, 2rem);
        font-weight: 700;
      }
      .beta {
        padding: 2px 8px;
        border: 1px solid var(--border);
        border-radius: 999px;
        color: var(--text-muted);
        font-size: 0.66rem;
        letter-spacing: 0.08em;
      }
      .subtitle {
        margin: 5px 0 0;
        color: var(--text-muted);
      }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 16px 0;
      }
      .toolbar-left,
      .toolbar-right,
      .filters,
      .view-toggle,
      .sort-controls,
      .arrange-actions,
      .row-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar-right {
        margin-left: auto;
        flex-wrap: wrap;
        justify-content: flex-end;
      }
      .pill,
      .filter,
      .view-btn,
      .step-btn,
      .drag-handle,
      .theme-button {
        min-height: 42px;
        padding: 8px 14px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: var(--bg-secondary);
        color: var(--text-secondary);
        cursor: pointer;
        transition: 0.15s ease;
      }
      .pill:hover,
      .filter:hover,
      .view-btn:hover,
      .step-btn:hover,
      .drag-handle:hover {
        border-color: var(--primary);
        color: var(--text-primary);
      }
      .pill.primary {
        border-color: var(--primary);
        background: color-mix(in oklch, var(--primary), var(--bg-secondary) 88%);
        color: var(--text-primary);
      }
      .pill:focus-visible,
      .filter:focus-visible,
      .view-btn:focus-visible,
      select:focus-visible,
      .step-btn:focus-visible,
      .drag-handle:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
      }
      .filter {
        min-height: 38px;
        padding: 6px 13px;
        background: transparent;
      }
      .filter[aria-pressed="true"],
      .view-btn[aria-pressed="true"] {
        border-color: var(--primary);
        color: var(--text-primary);
        background: color-mix(in oklch, var(--primary), transparent 88%);
      }
      .view-btn {
        display: inline-grid;
        place-items: center;
        width: 42px;
        padding: 0;
      }
      select {
        min-height: 42px;
        padding: 7px 34px 7px 12px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-primary);
        background: var(--bg-secondary);
      }
      .sort-controls label {
        color: var(--text-muted);
        font-size: 0.88rem;
      }
      .state-strip {
        margin: 12px 0;
        padding: 11px 14px;
        border: 1px solid var(--border);
        border-radius: var(--radius);
        color: var(--text-secondary);
        background: var(--bg-secondary);
      }
      .state-strip.error {
        border-color: var(--danger);
        color: var(--danger);
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(min(340px, 100%), 1fr));
        gap: 14px;
      }
      .card-frame,
      .row-frame {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .collection-card {
        display: grid;
        grid-template-columns: 70px minmax(0, 1fr);
        gap: 14px;
        width: 100%;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
        background: var(--bg-secondary);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .collection-card:hover,
      .collection-row:hover {
        border-color: var(--primary);
        background: color-mix(in oklch, var(--bg-secondary), var(--hover-mix) 4%);
      }
      .coin {
        display: grid;
        place-items: center;
        width: 70px;
        height: 70px;
        border: 1px solid color-mix(in oklch, var(--primary), var(--border) 45%);
        border-radius: 50%;
        background: radial-gradient(
          circle at 35% 30%,
          color-mix(in oklch, var(--primary), white 25%),
          color-mix(in oklch, var(--primary), var(--bg-tertiary) 58%) 40%,
          var(--bg-tertiary)
        );
        color: var(--bg-primary);
        font-weight: 800;
        font-size: 0.82rem;
      }
      .card-body {
        min-width: 0;
      }
      .name {
        display: block;
        overflow: hidden;
        color: var(--text-primary);
        font-weight: 700;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .meta,
      .card-foot {
        display: block;
        color: var(--text-muted);
        font-size: 0.82rem;
      }
      .counts {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin: 8px 0 6px;
        font-size: 0.84rem;
      }
      .progress {
        height: 6px;
        overflow: hidden;
        border-radius: 999px;
        background: var(--bg-tertiary);
      }
      .progress span {
        display: block;
        height: 100%;
        background: var(--primary);
      }
      .card-foot {
        margin-top: 8px;
      }
      .new-card {
        display: flex;
        min-height: 125px;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 4px;
        border-style: dashed;
        color: var(--text-muted);
        text-align: center;
      }
      .ledger {
        overflow: hidden;
        border: 1px solid var(--border);
        border-radius: var(--radius-lg);
      }
      .ledger-head,
      .collection-row {
        display: grid;
        grid-template-columns: 54px minmax(150px, 1.5fr) minmax(125px, 1fr) 78px 115px 112px 32px;
        align-items: center;
        gap: 12px;
        padding: 11px 14px;
      }
      .ledger-head {
        background: var(--bg-tertiary);
        color: var(--text-muted);
        font-size: 0.74rem;
        font-weight: 700;
        letter-spacing: 0.05em;
        text-transform: uppercase;
      }
      .ledger-head button {
        padding: 4px 0;
        border: 0;
        background: transparent;
        color: inherit;
        font-size: inherit;
        font-weight: inherit;
        text-align: left;
        cursor: pointer;
      }
      .ledger-head button[aria-pressed="true"] {
        color: var(--text-primary);
        text-decoration: underline;
        text-underline-offset: 4px;
      }
      .collection-row {
        width: 100%;
        border: 0;
        border-top: 1px solid var(--border);
        background: var(--bg-secondary);
        color: inherit;
        text-align: left;
        cursor: pointer;
      }
      .collection-row .coin {
        width: 44px;
        height: 44px;
        font-size: 0.68rem;
      }
      .numeric {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .arrange-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin: 14px 0;
        padding: 12px 14px;
        border: 1px solid color-mix(in oklch, var(--primary), var(--border) 40%);
        border-radius: var(--radius);
        background: color-mix(in oklch, var(--primary), var(--bg-secondary) 93%);
      }
      .arrange-copy {
        color: var(--text-secondary);
      }
      .arrange-copy strong {
        display: block;
        color: var(--text-primary);
      }
      .drag-handle {
        min-width: 42px;
        padding: 6px 10px;
        touch-action: none;
        cursor: grab;
      }
      .drag-handle:active {
        cursor: grabbing;
      }
      .step-btn {
        min-width: 42px;
        min-height: 38px;
        padding: 5px 10px;
      }
      .card-frame > .reorder-controls,
      .row-frame > .reorder-controls {
        display: none;
        flex: 0 0 auto;
        gap: 5px;
      }
      .is-arranging .card-frame > .reorder-controls,
      .is-arranging .row-frame > .reorder-controls {
        display: flex;
      }
      .card-frame > .collection-card,
      .row-frame > .collection-row {
        flex: 1 1 auto;
        min-width: 0;
      }
      .move-live {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
      }
      .empty {
        padding: 54px 20px;
        border: 1px dashed var(--border);
        border-radius: var(--radius-lg);
        color: var(--text-muted);
        text-align: center;
      }
      .skeleton {
        height: 116px;
        border-radius: var(--radius-lg);
        background: linear-gradient(
          90deg,
          var(--bg-secondary),
          var(--bg-tertiary),
          var(--bg-secondary)
        );
        background-size: 200% 100%;
        animation: shimmer 1.3s infinite;
      }
      @keyframes shimmer {
        to {
          background-position: -200% 0;
        }
      }
      @media (max-width: 740px) {
        body {
          padding: 18px 12px 36px;
        }
        .hub-head,
        .toolbar,
        .arrange-bar {
          align-items: flex-start;
          flex-direction: column;
        }
        .toolbar-right {
          width: 100%;
          justify-content: flex-start;
          margin-left: 0;
        }
        .filters {
          width: 100%;
          overflow-x: auto;
          padding-bottom: 2px;
        }
        .filters .filter {
          flex: 0 0 auto;
        }
        .ledger-head {
          display: none;
        }
        .card-frame,
        .row-frame {
          display: block;
        }
        .is-arranging .card-frame > .reorder-controls,
        .is-arranging .row-frame > .reorder-controls {
          justify-content: flex-end;
          margin-top: 6px;
        }
        .collection-row {
          grid-template-columns: 46px minmax(120px, 1fr) 92px 32px;
          gap: 8px;
          padding: 10px;
        }
        .collection-row .mobile-progress {
          grid-column: 2 / 4;
          display: flex;
          align-items: center;
          gap: 8px;
        }
        .collection-row .numeric,
        .collection-row .hide-mobile {
          display: none;
        }
        .ledger {
          border: 0;
          display: grid;
          gap: 8px;
          overflow: visible;
        }
        .collection-row {
          border: 1px solid var(--border);
          border-radius: var(--radius);
        }
        .sort-controls {
          width: 100%;
          flex-wrap: wrap;
        }
        .sort-controls select {
          flex: 1;
        }
        .preview-tools {
          justify-content: flex-start;
          flex-wrap: wrap;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="app container-fluid">
      <div class="preview-tools" aria-label="Preview settings">
        <select id="theme" aria-label="Theme">
          <option value="dark">Dark theme</option>
          <option value="light">Light theme</option>
          <option value="slate">Slate theme</option>
          <option value="sepia">Sepia theme</option>
        </select>
        <select id="view" aria-label="Preview view">
          <option value="album">Album view</option>
          <option value="ledger">Ledger view</option>
        </select>
        <select id="demo-state" aria-label="Preview state">
          <option value="ready">Normal</option>
          <option value="empty">Empty</option>
          <option value="loading">Loading</option>
          <option value="error">Save error</option>
        </select>
      </div>
      <header class="hub-head">
        <div>
          <h1>Collections <span class="beta">BETA</span></h1>
          <p class="subtitle">
            Date runs and custom checklists, linked to the Items in your inventory.
          </p>
        </div>
      </header>
      <div id="app" aria-live="off"></div>
      <div class="move-live" aria-live="polite" id="live"></div>
    </main>
    <script>
      (() => {
        const collections = [
          {
            id: "ase-t1",
            name: "American Silver Eagle — Type 1",
            meta: "1986–2021 · Silver · Date run",
            initials: "ASE 1",
            year: 1986,
            pct: 42,
            owned: "15 / 36",
            value: "$612.40",
            cost: "$1,284",
            updated: 5,
            status: "progress",
          },
          {
            id: "ase-t2",
            name: "American Silver Eagle — Type 2",
            meta: "2021–present · Silver · Date run",
            initials: "ASE 2",
            year: 2021,
            pct: 67,
            owned: "4 / 6",
            value: "$184.20",
            cost: "$96",
            updated: 1,
            status: "progress",
          },
          {
            id: "maple",
            name: "Canadian Silver Maple Leaf",
            meta: "1988–present · Silver · Date run",
            initials: "MAPLE",
            year: 1988,
            pct: 28,
            owned: "11 / 39",
            value: "$450.65",
            cost: "$1,120",
            updated: 3,
            status: "progress",
          },
          {
            id: "libertad",
            name: "Mexican Libertad",
            meta: "1982–present · Silver · Date run",
            initials: "LIB",
            year: 1982,
            pct: 0,
            owned: "0 / 42",
            value: "—",
            cost: "—",
            updated: null,
            status: "notstarted",
          },
          {
            id: "morgan",
            name: "Morgan Dollar Mint Marks",
            meta: "Custom collection · 8 Slots",
            initials: "MORGAN",
            year: null,
            pct: 75,
            owned: "6 / 8",
            value: "$286.00",
            cost: "$340",
            updated: 2,
            status: "progress",
          },
          {
            id: "goldbacks",
            name: "Utah Goldbacks",
            meta: "Custom collection · 12 Slots",
            initials: "GOLD",
            year: null,
            pct: 100,
            owned: "12 / 12",
            value: "$1,032",
            cost: "Complete",
            updated: 4,
            status: "complete",
          },
        ];
        const defaults = ["ase-t1", "ase-t2", "maple", "libertad", "morgan", "goldbacks"];
        const state = {
          order: [...defaults],
          savedOrder: [...defaults],
          filter: "all",
          sortKey: "my-order",
          direction: "asc",
          view: "album",
          arranging: false,
          priorFilter: "all",
          dragged: null,
          demo: "ready",
        };
        const byId = (id) => collections.find((item) => item.id === id);
        const keys = [
          ["my-order", "My order", "asc"],
          ["name", "Name", "asc"],
          ["run-start", "Run start", "asc"],
          ["percent", "Percent complete", "desc"],
          ["recent", "Recently updated", "desc"],
          ["owned", "Owned", "desc"],
          ["value", "Value (melt)", "desc"],
          ["cost", "To complete", "asc"],
        ];
        const sort = (items) => {
          const index = new Map(state.order.map((id, i) => [id, i]));
          if (state.sortKey === "my-order")
            return [...items].sort((a, b) => index.get(a.id) - index.get(b.id));
          const value = (item) =>
            ({
              name: item.name,
              "run-start": item.year,
              percent: item.pct,
              recent: item.updated,
              owned: Number(item.owned.split(" /")[0]),
              value: Number(item.value.replace(/[^\d.]/g, "")) || null,
              cost: item.cost === "Complete" ? 0 : Number(item.cost.replace(/[^\d.]/g, "")) || null,
            })[state.sortKey];
          return [...items].sort((a, b) => {
            const av = value(a),
              bv = value(b);
            const aKnown = av !== null && av !== undefined && Number.isFinite(av),
              bKnown = bv !== null && bv !== undefined && Number.isFinite(bv);
            if (aKnown !== bKnown) return aKnown ? -1 : 1;
            if (!aKnown) return index.get(a.id) - index.get(b.id);
            const cmp =
              typeof av === "string"
                ? av.localeCompare(bv, undefined, { numeric: true, sensitivity: "base" })
                : av - bv;
            return (state.direction === "desc" ? -cmp : cmp) || index.get(a.id) - index.get(b.id);
          });
        };
        const button = (label, cls, action, attrs = "") =>
          `<button type="button" class="${cls}" ${attrs} data-action="${action}">${label}</button>`;
        const reorderControls = (item) =>
          `<span class="reorder-controls" aria-label="Reorder ${item.name}">${button("⠿", "drag-handle", `drag:${item.id}`, `aria-label="Drag ${item.name} to reorder" draggable="true"`)}${button("↑", "step-btn", `up:${item.id}`, `aria-label="Move ${item.name} up"`)}${button("↓", "step-btn", `down:${item.id}`, `aria-label="Move ${item.name} down"`)}</span>`;
        const card = (item) =>
          `<div class="card-frame" data-order-id="${item.id}"><button class="collection-card" type="button" data-action="open:${item.id}"><span class="coin">${item.initials}</span><span class="card-body"><span class="name">${item.name}</span><span class="meta">${item.meta}</span><span class="counts"><span>Owned ${item.owned}</span><strong>${item.pct}%</strong></span><span class="progress"><span style="width:${item.pct}%"></span></span><span class="card-foot">${item.value} melt · ${item.cost === "Complete" ? "Complete" : `${item.cost} to complete`}</span></span></button>${reorderControls(item)}</div>`;
        const row = (item) =>
          `<div class="row-frame" data-order-id="${item.id}"><button class="collection-row" type="button" data-action="open:${item.id}"><span class="coin">${item.initials}</span><span class="card-body"><span class="name">${item.name}</span><span class="meta">${item.meta}</span></span><span class="mobile-progress"><span class="progress flex-grow-1"><span style="width:${item.pct}%"></span></span><small>${item.pct}%</small></span><span class="numeric">${item.owned.split(" /")[0]}</span><span class="numeric">${item.value}</span><span class="numeric">${item.cost}</span><span aria-hidden="true">›</span></button>${reorderControls(item)}</div>`;
        const filtered = () => {
          const items = state.order
            .map(byId)
            .filter(Boolean)
            .filter((item) => state.filter === "all" || item.status === state.filter);
          return sort(items);
        };
        const render = () => {
          const root = document.querySelector("#app");
          root.classList.toggle("is-arranging", state.arranging);
          const filterBar = `<div class="filters" role="group" aria-label="Filter collections by status">${[
            ["all", "All"],
            ["progress", "In progress"],
            ["notstarted", "Not started"],
            ["complete", "Complete"],
          ]
            .map(([id, label]) =>
              button(
                label,
                "filter",
                `filter:${id}`,
                `aria-pressed="${state.filter === id}" ${state.arranging ? "disabled" : ""}`
              )
            )
            .join("")}</div>`;
          const choices = keys
            .map(
              ([id, label]) =>
                `<option value="${id}" ${id === state.sortKey ? "selected" : ""}>${label}</option>`
            )
            .join("");
          const controls = `<div class="sort-controls"><label for="sort">Sort</label><select id="sort" ${state.arranging ? "disabled" : ""}>${choices}</select><button class="pill" data-action="direction" aria-label="Reverse sort direction" ${state.sortKey === "my-order" || state.arranging ? "disabled" : ""}>${state.direction === "asc" ? "↑ Ascending" : "↓ Descending"}</button></div>`;
          const toolbar = `<div class="toolbar">${filterBar}<div class="toolbar-right">${controls}<div class="view-toggle" role="group" aria-label="View mode">${button("▦", "view-btn", "view:album", `aria-label="Album view" aria-pressed="${state.view === "album"}"`)}${button("☷", "view-btn", "view:ledger", `aria-label="Ledger view" aria-pressed="${state.view === "ledger"}"`)}</div>${button("⚙ Manage", "pill", "manage")}${!state.arranging ? button("↕ Arrange", "pill", "arrange") : ""}${!state.arranging ? button("＋ New collection", "pill primary", "new") : ""}</div></div>`;
          const arrange = state.arranging
            ? `<div class="arrange-bar"><div class="arrange-copy"><strong>Arrange Collections</strong>Drag a handle or use the arrows. Your order saves when you choose Done.</div><div class="arrange-actions">${button("Cancel", "pill", "cancel")}${button("Done", "pill primary", "done")}</div></div>`
            : "";
          let body = "";
          if (state.demo === "loading")
            body = `<div class="cards"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></div>`;
          else if (state.demo === "empty")
            body = `<div class="empty"><strong>No Collections yet</strong><br />Start with a Series Template or create a Custom Collection.</div>`;
          else {
            const items = filtered();
            if (state.view === "album")
              body = `<div class="cards">${items.map(card).join("")}${state.filter === "all" && !state.arranging ? `<button class="collection-card new-card" data-action="new"><strong>＋ New collection</strong><span>Blank checklist or clone a Series Template</span></button>` : ""}</div>`;
            else
              body = `<div class="ledger"><div class="ledger-head"><span></span><span>Collection</span><button data-header-sort="percent" aria-pressed="${state.sortKey === "percent"}">Progress ${state.sortKey === "percent" ? (state.direction === "asc" ? "↑" : "↓") : "↕"}</button><button data-header-sort="owned" aria-pressed="${state.sortKey === "owned"}">Owned</button><button data-header-sort="value" aria-pressed="${state.sortKey === "value"}">Value (melt)</button><button data-header-sort="cost" aria-pressed="${state.sortKey === "cost"}">To complete</button><span></span></div>${items.map(row).join("")}</div>`;
          }
          root.innerHTML = `${toolbar}${arrange}${state.demo === "error" ? `<div class="state-strip error" role="alert">Couldn’t save your order. Your changes are still here; try Done again.</div>` : ""}${state.demo === "loading" ? `<div class="state-strip">Loading Collections…</div>` : ""}${body}`;
          root.querySelectorAll("[data-action]").forEach((node) =>
            node.addEventListener("click", (event) => {
              const [action, id] = node.dataset.action.split(":");
              if (action === "filter" && !state.arranging) state.filter = id;
              if (action === "view") state.view = id;
              if (action === "direction" && state.sortKey !== "my-order")
                state.direction = state.direction === "asc" ? "desc" : "asc";
              if (action === "arrange") {
                state.arranging = true;
                state.priorFilter = state.filter;
                state.filter = "all";
                state.savedOrder = [...state.order];
                state.sortKey = "my-order";
              }
              if (action === "cancel") {
                state.order = [...state.savedOrder];
                state.arranging = false;
                state.filter = state.priorFilter;
              }
              if (action === "done") {
                if (state.demo === "error") state.demo = "ready";
                state.savedOrder = [...state.order];
                state.sortKey = "my-order";
                state.arranging = false;
                state.filter = state.priorFilter;
              }
              if ((action === "up" || action === "down") && state.arranging)
                move(id, action === "up" ? -1 : 1);
              if (action === "new" || action === "manage" || node.hasAttribute("data-open"))
                announce(
                  node.dataset.open
                    ? `Opening ${byId(node.dataset.open).name}`
                    : action === "new"
                      ? "New collection builder would open."
                      : "Collections settings would open."
                );
              if (action === "drag") event.preventDefault();
              render();
            })
          );
          root.querySelector("#sort").addEventListener("change", (event) => {
            const found = keys.find((row) => row[0] === event.target.value);
            state.sortKey = found[0];
            state.direction = found[2];
            render();
          });
          root.querySelectorAll("[data-header-sort]").forEach((node) =>
            node.addEventListener("click", () => {
              const key = node.dataset.headerSort;
              if (state.sortKey === key)
                state.direction = state.direction === "asc" ? "desc" : "asc";
              else {
                state.sortKey = key;
                state.direction =
                  key === "percent" || key === "owned" || key === "value" ? "desc" : "asc";
              }
              render();
            })
          );
          root.querySelectorAll(".drag-handle").forEach((handle) =>
            handle.addEventListener("pointerdown", (event) => {
              state.dragged = handle.dataset.action.split(":")[1];
              handle.setPointerCapture(event.pointerId);
              event.preventDefault();
            })
          );
        };
        document.addEventListener("pointerup", (event) => {
          if (!state.dragged) return;
          const dragged = state.dragged;
          state.dragged = null;
          const target = document
            .elementFromPoint(event.clientX, event.clientY)
            ?.closest("[data-order-id]");
          if (!target || target.dataset.orderId === dragged) return;
          const from = state.order.indexOf(dragged),
            to = state.order.indexOf(target.dataset.orderId);
          state.order.splice(from, 1);
          state.order.splice(to, 0, dragged);
          announce(`${byId(dragged).name} moved to position ${to + 1} of ${state.order.length}.`);
          render();
        });
        const move = (id, delta) => {
          const from = state.order.indexOf(id),
            to = Math.max(0, Math.min(state.order.length - 1, from + delta));
          if (from === to) return;
          state.order.splice(from, 1);
          state.order.splice(to, 0, id);
          announce(`${byId(id).name} moved to position ${to + 1} of ${state.order.length}.`);
          render();
          const focus = document.querySelector(
            `[data-action="${delta < 0 ? "up" : "down"}:${id}"]`
          );
          if (focus) focus.focus();
        };
        const announce = (text) => {
          document.querySelector("#live").textContent = "";
          requestAnimationFrame(() => (document.querySelector("#live").textContent = text));
        };
        document
          .querySelector("#theme")
          .addEventListener(
            "change",
            (e) => (document.documentElement.dataset.theme = e.target.value)
          );
        document.querySelector("#view").addEventListener("change", (e) => {
          state.view = e.target.value;
          render();
        });
        document.querySelector("#demo-state").addEventListener("change", (e) => {
          state.demo = e.target.value;
          if (state.demo === "error") state.arranging = true;
          if (state.demo === "empty") state.arranging = false;
          render();
        });
        render();
      })();
    </script>
  </body>
</html>
