# Vale lints the prose-core rule on project docs. The Prose style is deployed by skills-deploy
# (vale:Prose in .claude/project.json); edit it in Devops/skill-library/vale/styles/Prose.
# The Announce style is project-local and checks the release announcement rules in .context/voice.md.
StylesPath = .vale/styles
MinAlertLevel = warning

[{README.md,.context/*.md}]
BasedOnStyles = Prose

[about.html]
BasedOnStyles = Prose

[docs/announcements/v*.md]
BasedOnStyles = Prose, Announce
