<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="silverG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="goldG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#92700c"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d4a017"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bgG)"/>
  <!-- S-stack — symmetrically centered, equal width variation -->
  <!-- Top of S — sweep right -->
  <rect x="188" y="90" width="180" height="26" rx="13" fill="url(#silverG)" opacity="0.45"/>
  <rect x="152" y="128" width="145" height="26" rx="13" fill="url(#silverG)" opacity="0.68"/>
  <!-- Center gold — widest, boldest -->
  <rect x="156" y="172" width="200" height="30" rx="15" fill="url(#goldG)"/>
  <!-- Bottom of S — sweep left -->
  <rect x="215" y="218" width="145" height="26" rx="13" fill="url(#silverG)" opacity="0.68"/>
  <rect x="144" y="256" width="192" height="26" rx="13" fill="url(#silverG)" opacity="0.45"/>
  <!-- Wordmark centered below -->
  <text x="256" y="348" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="52" font-weight="700" letter-spacing="4">
    <tspan fill="#e2e8f0">STAK</tspan><tspan fill="#d4a017">TRAKR</tspan>
  </text>
  <!-- Tagline -->
  <text x="256" y="386" text-anchor="middle" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="13" fill="#475569" letter-spacing="3">TRACK YOUR STACK</text>
</svg>
